[devops]
debug = true
allowed_hosts = ['*']
static_url = static/
jwt_expiration_delta = 36000
media_root = upload/
; 凭据加密密钥：保存密码/私钥到平台时使用，首次部署生成一次并永久固定（换 key 会导致已存密钥无法解密）：
; python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
; 也可用同名环境变量 DEVOPS_CREDENTIAL_ENCRYPTION_KEY 覆盖本项
credential_encryption_key = iry-8JFOGlEn67VnQMS9q7tDzAN-bFXNQKoMMlVxB24=

[db.mysql]
host = 192.168.12.107
port = 3306
name = devops
user = root
password = Yinwei999!
options = {"charset": "utf8mb4", "init_command": "SET FOREIGN_KEY_CHECKS=0"}

[db.redis]
host = 192.168.12.107
port = 6379
password = root999

[realtime]
; 与 [db.redis] 同一实例，db 编号避开 broker(/1)、result(/2)、cache 用的库
; 也可用环境变量 DEVOPS_REALTIME_REDIS_URL / DEVOPS_REALTIME_ALLOWED_ORIGINS 覆盖
redis_url = redis://:root999@192.168.12.107:6379/3
; 浏览器访问前端页面时地址栏的 origin（协议+域名+端口），精确匹配、不支持通配符，多个用逗号分隔
allowed_origins = http://localhost:9527,http://127.0.0.1:9527


[email]
; 全局 SMTP，通知渠道类型为 email 时使用；也可用环境变量 DEVOPS_EMAIL_HOST 等同名键覆盖
; host 留空表示未配置：邮件通知会直接提示「未配置 SMTP」，不会静默去连 localhost:25
host =
port = 587
host_user =
host_password =
; 发件人地址，留空则依次回退 host_user、no-reply@devops.local
from =
; 587 端口通常开 STARTTLS（use_tls = 1）；465 端口用 SSL（use_ssl = 1）。两者不要同时开启
use_tls = 1
use_ssl = 0
timeout = 10


[runner]
; 本地开发默认使用 fake，线上部署可配置为 ansible。
mode = ansible
; 专用 Ansible 控制节点直接使用本机虚拟环境和 SSH 配置。
; 仅在排查 Ansible Runner 本身时临时开启，开启后会使用最高详细度。
debug = true
docker_enabled = false
process_isolation = false
