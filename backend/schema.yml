openapi: 3.0.3
info:
  title: DevOps Admin API
  version: 1.0.0
  description: DevOps execution platform APIs for users and RBAC, CMDB assets, automation
    resources, workflow runs, schedules, cloud provisioning, audit, notifications,
    and operational diagnostics.
paths:
  /api/v1/audit/events:
    get:
      operationId: audit_events_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: domain
        schema:
          type: string
          enum:
          - automation
          - cmdb
          - monitoring
          - ops
          - security
          - system
          - task
        description: |-
          * `ops` - Ops system
          * `task` - Task system
          * `automation` - Automation resources
          * `cmdb` - Asset management
          * `monitoring` - Monitoring management
          * `security` - Security
          * `system` - System
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: pageNum
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: result
        schema:
          type: string
          enum:
          - failure
          - success
        description: |-
          * `success` - Success
          * `failure` - Failure
      - in: query
        name: run_id
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      tags:
      - audit
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditEventList'
          description: ''
  /api/v1/audit/events/{id}:
    get:
      operationId: audit_events_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: 标识此 domain audit event 的 唯一整数值。
        required: true
      tags:
      - audit
      security:
      - BearerAuth: []
      responses:
