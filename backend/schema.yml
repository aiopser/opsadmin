  /api/v1/ops/runs:
    get:
      operationId: ops_runs_list
      description: 作业系统运行历史；与任务工作流共享执行引擎但不共享查询口径。
      parameters:
      - in: query
        name: execution_kind
        schema:
          type: string
          enum:
          - module
          - playbook
          - quick_command
          - workflow
        description: |-
          * `workflow` - Workflow
          * `quick_command` - Quick command
          * `playbook` - Playbook
          * `module` - Module
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: pageNum
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: 每页返回的结果数量。
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancel_requested
          - canceled
          - failed
          - pending
          - queued
          - running
          - success
          - timeout
          - waiting
        description: |-
          * `pending` - Pending
          * `queued` - Queued
          * `running` - Running
          * `waiting` - Waiting
          * `success` - Success
          * `failed` - Failed
          * `timeout` - Timeout
          * `cancel_requested` - Cancel requested
          * `canceled` - Canceled
      - in: query
        name: trigger_type
        schema:
          type: string
          enum:
          - api
          - manual
          - scheduled
        description: |-
          * `manual` - Manual
          * `api` - API
          * `scheduled` - Scheduled
      - in: query
        name: worker_pool
        schema:
          type: integer
      - in: query
        name: workflow_version
        schema:
          type: integer
      - in: query
        name: workflow_version__workflow
        schema:
          type: integer
      tags:
      - ops
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkflowRunList'
          description: ''
    post:
      operationId: ops_runs_create
      description: 作业系统运行历史；与任务工作流共享执行引擎但不共享查询口径。
