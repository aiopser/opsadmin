      description: |-
        支持逗号分隔主键批量删除的 Mixin。

        DELETE /api/v1/xxx/1,2,3 时批量删除并返回 {"deleted": n}，
        单个主键时回退到 StandardModelViewSet.destroy（保留 is_system 保护）。

        用法（显式继承，勿混入基类——否则会被基类自身的 destroy 覆盖）：
            class DictTypeViewSet(CommaSeparatedBulkDeleteMixin, StandardModelViewSet):
                ...

        注意：仅适用于无 is_system 批量保护需求的资源；
        角色等内置数据资源保留自身重写的 destroy，不应套用此 Mixin。
      summary: 获取字典列表
      parameters:
      - in: query
        name: dict_code
        schema:
          type: string
      - in: query
        name: id
        schema:
          type: integer
      - name: keywords
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: pageNum
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: pageSize
        required: false
        in: query
        description: Number of results to return per page.
