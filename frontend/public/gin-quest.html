<script id="project-files" type="application/json">{".dockerignore": "*.db\n*.db-*\n.env\n.git\ngin-quest\n*.exe\n", ".gitignore": "*.db\n*.db-*\n.env\n*.exe\ngin-quest\n", "auth.go": "package main\n\nimport (\n\t\"errors\"\n\t\"net/http\"\n\t\"strconv\"\n\t\"strings\"\n\t\"time\"\n\n\t\"github.com/gin-gonic/gin\"\n\t\"github.com/golang-jwt/jwt/v5\"\n\t\"golang.org/x/crypto/bcrypt\"\n\t\"gorm.io/gorm\"\n\t\"gorm.io/gorm/clause\"\n)\n\ntype App struct {\n\tdb        *gorm.DB\n\tsecret    []byte\n\tdummyHash []byte\n}\n\ntype Credentials struct {\n\tEmail    string `json:\"email\" binding:\"required,email,max=254\"`\n\tPassword string `json:\"password\" binding:\"required\"`\n}\n\nfunc (a *App) register(c *gin.Context) {\n\tvar input Credentials\n\tif err := c.ShouldBindJSON(&input); err != nil {\n\t\tfail(c, 400, \"请求字段无效\")\n\t\treturn\n\t}\n\tif len(input.Password) \u003c 12 || len(input.Password) > 72 {\n\t\tfail(c, 400, \"密码需要 12 到 72 字节\")\n\t\treturn\n\t}\n\temail := strings.ToLower(strings.TrimSpace(input.Email))\n\thash, err := bcrypt.GenerateFromPassword([]byte(input.Password), bcrypt.DefaultCost)\n\tif err != nil {\n\t\tfail(c, 500, \"密码处理失败\")\n\t\treturn\n\t}\n\tuser := User{Email: email, PasswordHash: string(hash)}\n\tresult := a.db.WithContext(c.Request.Context()).Clauses(clause.OnConflict{\n\t\tColumns: []clause.Column{{Name: \"email\"}}, DoNothing: true,\n\t}).Create(&user)\n\tif result.Error != nil {\n\t\tfail(c, 500, \"保存用户失败\")\n\t\treturn\n\t}\n\tif result.RowsAffected == 0 {\n\t\tfail(c, 409, \"邮箱已被注册\")\n\t\treturn\n\t}\n\tc.JSON(http.StatusCreated, gin.H{\"id\": user.ID, \"email\": user.Email})\n}\n\nfunc (a *App) login(c *gin.Context) {\n\tvar input Credentials\n\tif err := c.ShouldBindJSON(&input); err != nil {\n\t\tfail(c, 400, \"请求字段无效\")\n\t\treturn\n\t}\n\tif len(input.Password) > 72 {\n\t\tfail(c, 401, \"邮箱或密码错误\")\n\t\treturn\n\t}\n\tvar user User\n\terr := a.db.WithContext(c.Request.Context()).Where(\"email = ?\", strings.ToLower(strings.TrimSpace(input.Email))).First(&user).Error\n\tif err != nil && !errors.Is(err, gorm.ErrRecordNotFound) {\n\t\tfail(c, 500, \"查询用户失败\")\n\t\treturn\n\t}\n\thash := []byte(user.PasswordHash)\n\tif errors.Is(err, gorm.ErrRecordNotFound) {\n\t\thash = a.dummyHash\n\t}\n\tpasswordErr := bcrypt.CompareHashAndPassword(hash, []byte(input.Password))\n\tif err != nil || passwordErr != nil {\n\t\tfail(c, 401, \"邮箱或密码错误\")\n\t\treturn\n\t}\n\tnow := time.Now()\n\tclaims := jwt.RegisteredClaims{\n\t\tSubject: strconv.FormatUint(uint64(user.ID), 10), Issuer: \"gin-quest\",\n\t\tAudience: jwt.ClaimStrings{\"gin-quest-client\"},\n\t\tIssuedAt: jwt.NewNumericDate(now), ExpiresAt: jwt.NewNumericDate(now.Add(15 * time.Minute)),\n\t}\n\ttoken, err := jwt.NewWithClaims(jwt.SigningMethodHS256, claims).SignedString(a.secret)\n\tif err != nil {\n\t\tfail(c, 500, \"签发凭证失败\")\n\t\treturn\n\t}\n\tc.JSON(200, gin.H{\"access_token\": token, \"token_type\": \"Bearer\", \"expires_in\": 900})\n}\n\nfunc (a *App) authenticate() gin.HandlerFunc {\n\treturn func(c *gin.Context) {\n\t\tparts := strings.Fields(c.GetHeader(\"Authorization\"))\n\t\tif len(parts) != 2 || !strings.EqualFold(parts[0], \"Bearer\") {\n\t\t\tfail(c, 401, \"需要有效登录凭证\")\n\t\t\treturn\n\t\t}\n\t\tclaims := &jwt.RegisteredClaims{}\n\t\ttoken, err := jwt.ParseWithClaims(parts[1], claims, func(token *jwt.Token) (interface{}, error) {\n\t\t\treturn a.secret, nil\n\t\t}, jwt.WithValidMethods([]string{\"HS256\"}), jwt.WithIssuer(\"gin-quest\"),\n\t\t\tjwt.WithAudience(\"gin-quest-client\"), jwt.WithExpirationRequired(), jwt.WithIssuedAt())\n\t\tif err != nil || !token.Valid {\n\t\t\tfail(c, 401, \"凭证无效或已过期\")\n\t\t\treturn\n\t\t}\n\t\tid, err := strconv.ParseUint(claims.Subject, 10, 32)\n\t\tif err != nil || id == 0 {\n\t\t\tfail(c, 401, \"凭证无效\")\n\t\t\treturn\n\t\t}\n\t\tvar user User\n\t\terr = a.db.WithContext(c.Request.Context()).First(&user, uint(id)).Error\n\t\tif errors.Is(err, gorm.ErrRecordNotFound) {\n\t\t\tfail(c, 401, \"用户不存在\")\n\t\t\treturn\n\t\t}\n\t\tif err != nil {\n\t\t\tfail(c, 503, \"暂时无法验证用户\")\n\t\t\treturn\n\t\t}\n\t\tc.Set(\"userID\", uint(id))\n\t\tc.Next()\n\t}\n}\n", "cmd/key/main.go": "package main\n\nimport (\n\t\"crypto/rand\"\n\t\"encoding/base64\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main() {\n\tvar key [48]byte\n\tif _, err := rand.Read(key[:]); err != nil {\n\t\tfmt.Fprintln(os.Stderr, err)\n\t\tos.Exit(1)\n\t}\n\tfmt.Println(base64.RawURLEncoding.EncodeToString(key[:]))\n}\n", "config.go": "package main\n\nimport (\n\t\"errors\"\n\t\"os\"\n)\n\ntype Config struct {\n\tAddr   string\n\tDBPath string\n\tSecret []byte\n}\n\nfunc loadConfig() (Config, error) {\n\tcfg := Config{Addr: os.Getenv(\"ADDR\"), DBPath: os.Getenv(\"DB_PATH\"), Secret: []byte(os.Getenv(\"JWT_SECRET\"))}\n\tif cfg.Addr == \"\" {\n\t\tcfg.Addr = \"127.0.0.1:8080\"\n\t}\n\tif cfg.DBPath == \"\" {\n\t\tcfg.DBPath = \"quest.db\"\n\t}\n\tif len(cfg.Secret) \u003c 32 {\n\t\treturn Config{}, errors.New(\"JWT_SECRET 至少需要 32 字节，请用 go run ./cmd/key 生成随机密钥\")\n\t}\n\treturn cfg, nil\n}\n", "Dockerfile": "FROM golang:1.25-alpine AS build\nWORKDIR /src\nCOPY . .\nRUN go mod download && CGO_ENABLED=0 go build -tags=nomsgpack -trimpath -o /out/gin-quest .\n\nFROM alpine:3.22\nRUN adduser -D -u 10001 app && mkdir -p /data && chown app:app /data\nCOPY --from=build /out/gin-quest /usr/local/bin/gin-quest\nUSER app\nWORKDIR /data\nENV ADDR=:8080 DB_PATH=/data/quest.db\nEXPOSE 8080\nENTRYPOINT [\"gin-quest\"]\n", "go.mod": "module example.com/gin-quest\n\ngo 1.25.0\n\nrequire (\n\tgithub.com/gin-gonic/gin v1.12.0\n\tgithub.com/glebarez/sqlite v1.11.0\n\tgithub.com/golang-jwt/jwt/v5 v5.3.1\n\tgolang.org/x/crypto v0.48.0\n\tgorm.io/gorm v1.31.1\n)\n\nrequire (\n\tgithub.com/bytedance/gopkg v0.1.3 // indirect\n\tgithub.com/bytedance/sonic v1.15.0 // indirect\n\tgithub.com/bytedance/sonic/loader v0.5.0 // indirect\n\tgithub.com/cloudwego/base64x v0.1.6 // indirect\n\tgithub.com/dustin/go-humanize v1.0.1 // indirect\n tuid, ok := userID(c)\n\tif !ok {\n\t\treturn\n\t}\n\tvar input struct {\n\t\tTitle string `json:\"title\" binding:\"required,max=120\"`\n\t}\n\tif err := c.ShouldBindJSON(&input); err != nil {\n\t\tfail(c, 400, \"title 需要 1 到 120 个字符\")\n\t\treturn\n\t}\n\ttitle := strings.TrimSpace(input.Title)\n\tif title == \"\" {\n\t\tfail(c, 400, \"标题不能为空白\")\n\t\treturn\n\t}\n\tnote := Note{OwnerID: uid, Title: title}\n\tif err := a.db.WithContext(c.Request.Context()).Create(&note).Error; err != nil {\n\t\tfail(c, 500, \"保存失败\")\n\t\treturn\n\t}\n\tc.Header(\"Location\", \"/api/v1/notes/\"+strconv.FormatUint(uint64(note.ID), 10))\n\tc.JSON(201, noteView(note))\n}\n\nfunc (a *App) findNote(c *gin.Context) (Note, bool) {\n\tuid, ok := userID(c)\n\tif !ok {\n\t\treturn Note{}, false\n\t}\n\tid, ok := parseID(c)\n\tif !ok {\n\t\treturn Note{}, false\n\t}\n\tvar note Note\n\terr := a.db.WithContext(c.Request.Context()).Where(\"id = ? AND owner_id = ?\", id, uid).First(&note).Error\n\tif errors.Is(err, gorm.ErrRecordNotFound) {\n\t\tfail(c, 404, \"任务不存在\")\n\t\treturn Note{}, false\n\t}\n\tif err != nil {\n\t\tfail(c, 500, \"查询失败\")\n\t\treturn Note{}, false\n\t}\n\treturn note, true\n}\n\nfunc (a *App) getNote(c *gin.Context) {\n\tnote, ok := a.findNote(c)\n\tif ok {\n\t\tc.JSON(200, noteView(note))\n\t}\n}\n\nfunc (a *App) updateNote(c *gin.Context) {\n\tnote, ok := a.findNote(c)\n\tif !ok {\n\t\treturn\n\t}\n\tvar input struct {\n\t\tTitle *string `json:\"title\" binding:\"omitempty,max=120\"`\n\t\tDone  *bool   `json:\"done\"`\n\t}\n\tif err := c.ShouldBindJSON(&input); err != nil {\n\t\tfail(c, 400, \"请求字段无效\")\n\t\treturn\n\t}\n\tupdates := make(map[string]interface{})\n\tif input.Title != nil {\n\t\ttitle := strings.TrimSpace(*input.Title)\n\t\tif title == \"\" {\n\t\t\tfail(c, 400, \"标题不能为空白\")\n\t\t\treturn\n\t\t}\n\t\tupdates[\"title\"] = title\n\t}\n\tif input.Done != nil {\n\t\tupdates[\"done\"] = *input.Done\n\t}\n\tif len(updates) == 0 {\n\t\tfail(c, 400, \"请至少提交 title 或 done\")\n\t\treturn\n\t}\n\tresult := a.db.WithContext(c.Request.Context()).Model(&Note{}).Where(\"id = ? AND owner_id = ?\", note.ID, note.OwnerID).Updates(updates)\n\tif result.Error != nil {\n\t\tfail(c, 500, \"更新失败\")\n\t\treturn\n\t}\n\tif result.RowsAffected == 0 {\n\t\tfail(c, 404, \"任务不存在\")\n\t\treturn\n\t}\n\tnote, ok = a.findNote(c)\n\tif ok {\n\t\tc.JSON(200, noteView(note))\n\t}\n}\n\nfunc (a *App) deleteNote(c *gin.Context) {\n\tnote, ok := a.findNote(c)\n\tif !ok {\n\t\treturn\n\t}\n\tresult := a.db.WithContext(c.Request.Context()).Where(\"id = ? AND owner_id = ?\", note.ID, note.OwnerID).Delete(&Note{})\n\tif result.Error != nil {\n\t\tfail(c, 500, \"删除失败\")\n\t\treturn\n\t}\n\tif result.RowsAffected == 0 {\n\t\tfail(c, 404, \"任务不存在\")\n\t\treturn\n\t}\n\tc.Status(204)\n}\n", "main.go": "package main\n\nimport (\n\t\"context\"\n\t\"errors\"\n\t\"flag\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"os\"\n\t\"os/signal\"\n\t\"syscall\"\n\t\"time\"\n\n\t\"github.com/gin-gonic/gin\"\n)\n\nfunc run(migrate bool) error {\n\tcfg, err := loadConfig()\n\tif err != nil {\n\t\treturn err\n\t}\n\tdb, err := openDB(cfg.DBPath)\n\tif err != nil {\n\t\treturn err\n\t}\n\tpool, err := db.DB()\n\tif err != nil {\n\t\treturn err\n\t}\n\tdefer pool.Close()\n\tif migrate {\n\t\treturn db.AutoMigrate(&User{}, &Note{})\n\t}\n\tgin.SetMode(gin.ReleaseMode)\n\trouter, err := newRouter(db, cfg.Secret)\n\tif err != nil {\n\t\treturn err\n\t}\n\tserver := &http.Server{\n\t\tAddr: cfg.Addr, Handler: router, ReadHeaderTimeout: 5 * time.Second,\n\t\tReadTimeout: 10 * time.Second, WriteTimeout: 15 * time.Second, IdleTimeout: 60 * time.Second,\n\t}\n\tctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)\n\tdefer stop()\n\tstopped := make(chan struct{})\n\tgo func() {\n\t\tdefer close(stopped)\n\t\t\u003c-ctx.Done()\n\t\tdeadline, cancel := context.WithTimeout(context.Background(), 5*time.Second)\n\t\tdefer cancel()\n\t\tif err := server.Shutdown(deadline); err != nil {\n\t\t\t_ = server.Close()\n\t\t}\n\t}()\n\tslog.Info(\"服务启动\", \"address\", cfg.Addr)\n\terr = server.ListenAndServe()\n\tif err != nil && !errors.Is(err, http.ErrServerClosed) {\n\t\tstop()\n\t\t\u003c-stopped\n\t\treturn err\n\t}\n\t\u003c-stopped\n\tslog.Info(\"服务停止\")\n\treturn nil\n}\n\nfunc main() {\n\tmigrate := flag.Bool(\"migrate\", false, \"为教学数据库建表，然后退出\")\n\tflag.Parse()\n\tif err := run(*migrate); err != nil {\n\t\tslog.Error(\"退出\", \"error\", err)\n\t\tos.Exit(1)\n\t}\n}\n", "main_test.go": "package main\n\nimport (\n\t\"encoding/json\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"path/filepath\"\n\t\"strconv\"\n\t\"strings\"\n\t\"testing\"\n\t\"time\"\n\n\t\"github.com/gin-gonic/gin\"\n\t\"github.com/golang-jwt/jwt/v5\"\n)\n\nvar testSecret = []byte(\"test-only-secret-must-not-be-used-in-production\")\n\nfunc setup(t *testing.T) http.Handler {\n\tt.Helper()\n\tgin.SetMode(gin.TestMode)\n\tdb, err := openDB(filepath.Join(t.TempDir(), \"test.db\"))\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tpool, err := db.DB()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tt.Cleanup(func() { _ = pool.Close() })\n\tif err := db.AutoMigrate(&User{}, &Note{}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\trouter, err := newRouter(db, testSecret)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\treturn router\n}\n\nfunc request(h http.Handler, method, path, body, token string) *httptest.ResponseRecorder {\n\trec := httptest.NewRecorder()\n\treq := httptest.NewRequest(method, path, strings.NewReader(body))\n\treq.Header.Set(\"Content-Type\", \"application/json\")\n\tif token != \"\" {\n\t\treq.Header.Set(\"Authorization\", \"Bearer \"+token)\n\t}\n\th.ServeHTTP(rec, req)\n\treturn rec\n}\n\nfunc account(t *testing.T, h http.Handler, email string) string {\n\tt.Helper()\n\tbody := `{\"email\":\"` + email + `\",\"password\":\"correct-password-123\"}`\n\trec := request(h, \"POST\", \"/api/v1/auth/register\", body, \"\")\n\tif rec.Code != 201 {\n\t\tt.Fatalf(\"register: %d %s\", rec.Code, rec.Body)\n\t}\n\trec = request(h, \"POST\", \"/api/v1/auth/login\", body, \"\")\n\tif rec.Code != 200 {\n\t\tt.Fatalf(\"login: %d %s\", rec.Code, rec.Body)\n\t}\n\tvar result struct {\n\t\tToken string `json:\"access_token\"`\n\t}\n\tif err := json.Unmarshal(rec.Body.Bytes(), &result); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif result.Token == \"\" {\n\t\tt.Fatal(\"missing token\")\n\t}\n\treturn result.Token\n}\n\nfunc TestCRUDAndIsolation(t *testing.T) {\n\th := setup(t)\n\towner := account(t, h, \"alice@example.com\")\n\tother := account(t, h, \"bob@example.com\")\n\trec := request(h, \"POST\", \"/api/v1/notes\", `{\"title\":\"Learn Gin\"}`, owner)\n\tif rec.Code != 201 {\n\t\tt.Fatalf(\"create: %d %s\", rec.Code, rec.Body)\n\t}\n\tvar created NoteView\n\tif err := json.Unmarshal(rec.Body.Bytes(), &created); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tpath := \"/api/v1/notes/\" + strconv.FormatUint(uint64(created.ID), 10)\n\tfor _, method := range []string{\"GET\", \"PATCH\", \"DELETE\"} {\n\t\trec = request(h, method, path, `{\"done\":true}`, other)\n\t\tif rec.Code != 404 {\n\t\t\tt.Fatalf(\"isolation %s: %d\", method, rec.Code)\n\t\t}\n\t}\n\tfor _, value := range []string{\"true\", \"false\"} {\n\t\trec = request(h, \"PATCH\", path, `{\"done\":`+value+`}`, owner)\n\t\tif rec.Code != 200 {\n\t\t\tt.Fatalf(\"update: %d %s\", rec.Code, rec.Body)\n\t\t}\n\t\tvar updated NoteView\n\t\tif err := json.Unmarshal(rec.Body.Bytes(), &updated); err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\tif updated.Done != (value == \"true\") {\n\t\t\tt.Fatal(\"zero-value update lost\")\n\t\t}\n\t}\n\trec = request(h, \"GET\", \"/api/v1/notes?page=1&size=5\", \"\", other)\n\tvar list struct {\n\t\tItems []NoteView `json:\"items\"`\n\t\tTotal int64      `json:\"total\"`\n\t}\n\tif err := json.Unmarshal(rec.Body.Bytes(), &list); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif list.Total != 0 || len(list.Items) != 0 {\n\t\tt.Fatal(\"other user's list leaked\")\n\t}\n\trec = request(h, \"DELETE\", path, \"\", owner)\n\tif rec.Code != 204 || rec.Body.Len() != 0 {\n\t\tt.Fatalf(\"delete: %d\", rec.Code)\n\t}\n\trec = request(h, \"GET\", path, \"\", owner)\n\tif rec.Code != 404 {\n\t\tt.Fatal(\"deleted note still visible\")\n\t}\n}\n\nfunc TestValidationAndAuth(t *testing.T) {\n\th := setup(t)\n\ttoken := account(t, h, \"test@example.com\")\n\tcases := []struct {\n\t\tmethod, path, body, token string\n\t\tstatus                    int\n\t}{\n\t\t{\"GET\", \"/api/v1/notes\", \"\", \"\", 401},\n\t\t{\"GET\", \"/api/v1/notes\", \"\", \"tampered\", 401},\n\t\t{\"GET\", \"/api/v1/notes?page=0\", \"\", token, 400},\n\t\t{\"GET\", \"/api/v1/notes?size=101\", \"\", token, 400},\n\t\t{\"GET\", \"/api/v1/notes/abc\", \"\", token, 400},\n\t\t{\"POST\", \"/api/v1/notes\", `{\"title\":\"   \"}`, token, 400},\n\t\t{\"POST\", \"/api/v1/notes\", `{\"title\":\"x\",\"owner_id\":2}`, token, 400},\n\t\t{\"POST\", \"/api/v1/notes\", `{\"title\":123}`, token, 400},\n\t\t{\"POST\", \"/api/v1/notes\", `{\"title\":\"` + strings.Repeat(\"x\", 17000) + `\"}`, token, 400},\n\t\t{\"POST\", \"/api/v1/auth/register\", `{\"email\":\"test@example.com\",\"password\":\"correct-password-123\"}`, \"\", 409},\n\t\t{\"POST\", \"/api/v1/auth/register\", `{\"email\":\"other@example.com\",\"password\":\"short\"}`, \"\", 400},\n\t\t{\"POST\", \"/api/v1/auth/login\", `{\"email\":\"test@example.com\",\"password\":\"wrong-password\"}`, \"\", 401},\n\t\t{\"GET\", \"/missing\", \"\", \"\", 404},\n\t\t{\"PUT\", \"/api/v1/notes\", \"\", token, 405},\n\t}\n\tfor i, tc := range cases {\n\t\tt.Run(strconv.Itoa(i), func(t *testing.T) {\n\t\t\trec := request(h, tc.method, tc.path, tc.body, tc.token)\n\t\t\tif rec.Code != tc.status {\n\t\t\t\tt.Fatalf(\"got %d want %d: %s\", rec.Code, tc.status, rec.Body)\n\t\t\t}\n\t\t\tif rec.Header().Get(\"X-Request-ID\") == \"\" {\n\t\t\t\tt.Fatal(\"missing request id\")\n\t\t\t}\n\t\t})\n\t}\n}\n\nfunc TestExpiredAndWrongAlgorithm(t *testing.T) {\n\th := setup(t)\n\t_ = account(t, h, \"jwt@example.com\")\n\tfor _, method := range []jwt.SigningMethod{jwt.SigningMethodHS256, jwt.SigningMethodHS384} {\n\t\tclaims := jwt.RegisteredClaims{Subject: \"1\", Issuer: \"gin-quest\", Audience: jwt.ClaimStrings{\"gin-quest-client\"}, ExpiresAt: jwt.NewNumericDate(time.Now().Add(-time.Hour))}\n\t\tif method == jwt.SigningMethodHS384 {\n\t\t\tclaims.ExpiresAt = jwt.NewNumericDate(time.Now().Add(time.Hour))\n\t\t}\n\t\ttoken, err := jwt.NewWithClaims(method, claims).SignedString(testSecret)\n\t\tif err != nil {\n\t\t\tt.Fatal(err)\n\t\t}\n\t\trec := request(h, \"GET\", \"/api/v1/notes\", \"\", token)\n\t\tif rec.Code != 401 {\n\t\t\tt.Fatalf(\"bad jwt accepted: %d\", rec.Code)\n\t\t}\n\t}\n}\n\nfunc TestPersistence(t *testing.T) {\n\tpath := filepath.Join(t.TempDir(), \"persist.db\")\n\tdb, err := openDB(path)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := db.AutoMigrate(&Note{}); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := db.Create(&Note{OwnerID: 1, Title: \"Still here\"}).Error; err != nil {\n\t\tt.Fatal(err)\n\t}\n\tpool, err := db.DB()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif err := pool.Close(); err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdb, err = openDB(path)\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tpool, err = db.DB()\n\tif err != nil {\n\t\tt.Fatal(err)\n\t}\n\tdefer pool.Close()\n\tvar count int64\n\tif err := db.Model(&Note{}).Count(&count).Error; err != nil {\n\t\tt.Fatal(err)\n\t}\n\tif count != 1 {\n\t\tt.Fatalf(\"persistent count: %d\", count)\n\t}\n}\n", "models.go": "package main\n\nimport (\n\t\"time\"\n\n\t\"github.com/glebarez/sqlite\"\n\t\"gorm.io/gorm\"\n\t\"gorm.io/gorm/logger\"\n)\n\ntype User struct {\n\tID           uint   `gorm:\"primaryKey\"`\n\tEmail        string `gorm:\"size:254;uniqueIndex;not null\"`\n\tPasswordHash string `gorm:\"not null\" json:\"-\"`\n\tCreatedAt    time.Time\n}\n\ntype Note struct {\n\tID        uint   `gorm:\"primaryKey\"`\n\tOwnerID   uint   `gorm:\"index;not null\"`\n\tTitle     string `gorm:\"size:120;not null\"`\n\tDone      bool   `gorm:\"not null;default:false\"`\n\tCreatedAt time.Time\n\tUpdatedAt time.Time\n\tDeletedAt gorm.DeletedAt `gorm:\"index\" json:\"-\"`\n}\n\n// 仅返回接口需要的字段，数据库模型不直接成为响应契约。\ntype NoteView struct {\n\tID        uint      `json:\"id\"`\n\tTitle     string    `json:\"title\"`\n\tDone      bool      `json:\"done\"`\n\tCreatedAt time.Time `json:\"created_at\"`\n\tUpdatedAt time.Time `json:\"updated_at\"`\n}\n\nfunc noteView(n Note) NoteView {\n\treturn NoteView{ID: n.ID, Title: n.Title, Done: n.Done, CreatedAt: n.CreatedAt, UpdatedAt: n.UpdatedAt}\n}\n\nfunc openDB(path string) (*gorm.DB, error) {\n\tdb, err := gorm.Open(sqlite.Open(path), &gorm.Config{Logger: logger.Default.LogMode(logger.Silent)})\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tpool, err := db.DB()\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\t// SQLite 教学版限制一个连接，降低多写者锁冲突；生产选型需重新评估。\n\tpool.SetMaxOpenConns(1)\n\tpool.SetMaxIdleConns(1)\n\treturn db, nil\n}\n", "README.md": "# Gin Quest · 任务管理 API\n\nGo 1.25+，Gin 1.12.0，GORM 1.31.1，JWT v5.3.1；SQLite 使用 glebarez 纯 Go 驱动，无需安装 C 编译器或外部数据库。\n这是可运行的教学项目，包含注册、密码哈希、短期 JWT、按用户隔离的任务 CRUD、分页、软删除、持久化、请求 ID、测试与优雅关闭。\n\n## 先决条件与依赖\n\n先从 https://go.dev/dl/ 安装当前受支持的 Go 稳定版本（至少 1.25）。旧版 Go 可能依照 go.mod 自动下载工具链，需要网络。目录中的依赖版本是本课程复现基线，不代表最新安全补丁；公网使用前审查依赖与运行环境。\n\n所有命令在解压后的 gin-quest-project 目录执行。首次需要访问 Go 模块代理：\n\n```text\ngo mod tidy\ngo test -tags=nomsgpack ./...\ngo vet -tags=nomsgpack ./...\n```\n\nnomsgpack 关闭本项目未使用的 MsgPack 绑定功能，减少编译依赖。保留 go.mod、go.sum，CI 中使用相同构建标记。\n\n## Windows PowerShell\n\n```powershell\n$env:JWT_SECRET = go run ./cmd/key\ngo run -tags=nomsgpack . -migrate\ngo run -tags=nomsgpack .\n```\n\n## macOS / Linux\n\n```sh\nexport JWT_SECRET=\"$(go run ./cmd/key)\"\ngo run -tags=nomsgpack . -migrate\ngo run -tags=nomsgpack .\n```\n\n密钥仅在首次生成后安全保存；重启继续使用同一个 JWT_SECRET，不要每次重启重新生成。任何密钥变更都会使旧令牌失效。程序不会自动读取 .env 文件。\n默认监听 127.0.0.1:8080，SQLite 文件 quest.db 位于工作目录。配置项：ADDR、DB_PATH、JWT_SECRET。不要提交真实密钥。\n-migrate 使用 AutoMigrate 为本地教学库建表，执行后退出；生产环境应改为经过评审的版本化迁移。\n\n## PowerShell 调用示例（另开终端）\n\n```powershell\n$base = 'http://127.0.0.1:8080/api/v1'\n$body = '{\"email\":\"you@example.com\",\"password\":\"my-long-password-123\"}'\nInvoke-RestMethod \"$base/auth/register\" -Method Post -ContentType 'application/json' -Body $body\n$login = Invoke-RestMethod \"$base/auth/login\" -Method Post -ContentType 'application/json' -Body $body\n$headers = @{ Authorization = \"Bearer $($login.access_token)\" }\nInvoke-RestMethod \"$base/notes\" -Method Post -Headers $headers -ContentType 'application/json' -Body '{\"title\":\"Learn Gin\"}'\nInvoke-RestMethod \"$base/notes?page=1&size=10\" -Headers $headers\nInvoke-RestMethod \"$base/notes/1\" -Method Patch -Headers $headers -ContentType 'application/json' -Body '{\"done\":true}'\nInvoke-RestMethod \"$base/notes/1\" -Method Delete -Headers $headers\n```\n\n预期注册返回 201；登录返回 access_token；创建返回 201；查询与修改返回 200；删除返回 204 无正文。请在干净数据库上使用 id=1，其他情况使用创建响应中的 id。浏览器直接打开 /healthz 能测试存活，但不能替代登录 API 的调用。\n\n## 接口契约\n\n| 方法 | 路径 | 说明 |\n| --- | --- | --- |\n| GET | /healthz | 存活 |\n| GET | /readyz | 数据库连接可用性，不检查全部表结构 |\n| POST | /api/v1/auth/register | email、password |\n| POST | /api/v1/auth/login | 返回 15 分钟 access token |\n| GET | /api/v1/notes | page=1、size=10，size 最大 100 |\n| POST | /api/v1/notes | title |\n| GET | /api/v1/notes/:id | 当前用户的任务 |\n| PATCH | /api/v1/notes/:id | 可选 title、done，至少一个 |\n| DELETE | /api/v1/notes/:id | 当前用户的任务，软删除 |\n\n业务错误形如 {\"error\":{\"message\":\"…\"}}。未知字段会被拒绝。正文上限 16 KiB。ShouldBindJSON 不保证拒绝尾随的第二个 JSON 对象，严格单文档协议需使用自定义解码器并确认 EOF；手册有说明。\n\n## 构建与运行\n\n```text\ngo build -tags=nomsgpack -trimpath -o gin-quest .\n```\n\nWindows 输出名改为 gin-quest.exe。仍需配置 JWT_SECRET，并先执行 -migrate。Ctrl+C 触发最多 5 秒的优雅关闭。\n\nDocker（需要自行安装并运行 Docker，镜像构建需要网络）：\n\n```sh\ndocker build -t gin-quest:local .\ndocker volume create gin-quest-data\ndocker run --rm --env JWT_SECRET --mount source=gin-quest-data,target=/data gin-quest:local -migrate\ndocker run --rm --env JWT_SECRET -p 127.0.0.1:8080:8080 --mount source=gin-quest-data,target=/data gin-quest:local\n```\n\n以上示例仅绑定宿主机回环地址。新建的命名卷由镜像初始化目录权限；使用已有卷或宿主机 bind mount 时，需保证 UID 10001 可写。备份 SQLite 前停止写入或使用 SQLite 的一致性备份机制，不要随意复制正在写入的文件。\n\n## 测试覆盖与边界\n\n测试包含登录、CRUD、false 零值更新、跨用户读/改/删隔离、分页限制、非法字段、错误密码、过期 JWT、签名算法限制、数据库重新打开后的持久化。\n教学版未实现：登录限流、密码找回、刷新令牌/撤销、分布式部署、生产迁移、TLS 入口、CORS 前端集成、审计。要对外使用须先补齐相应功能与测试。SQLite 单连接为教学取舍，并非高吞吐架构。\n\nPostgreSQL 迁移为手册中的扩展任务，当前源码与测试实际使用 SQLite，不声称已经验证 PostgreSQL 或容器部署。\n", "router.go": "package main\n\nimport (\n\t\"context\"\n\t\"crypto/rand\"\n\t\"encoding/hex\"\n\t\"io\"\n\t\"log/slog\"\n\t\"net/http\"\n\t\"time\"\n\n\t\"github.com/gin-gonic/gin\"\n\t\"github.com/gin-gonic/gin/binding\"\n\t\"golang.org/x/crypto/bcrypt\"\n\t\"gorm.io/gorm\"\n)\n\nfunc newRouter(db *gorm.DB, secret []byte) (*gin.Engine, error) {\n\thash, err := bcrypt.GenerateFromPassword([]byte(\"dummy-password-not-a-user\"), bcrypt.DefaultCost)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\ta := &App{db: db, secret: secret, dummyHash: hash}\n\trouter := gin.New()\n\tif err := router.SetTrustedProxies(nil); err != nil {\n\t\treturn nil, err\n\t}\n\t// 进程启动时设置一次，运行中不要并发修改全局解码设置。\n\tbinding.EnableDecoderDisallowUnknownFields = true\n\trouter.HandleMethodNotAllowed = true\n\trouter.Use(gin.CustomRecoveryWithWriter(io.Discard, func(c *gin.Context, recovered interface{}) {\n\t\tslog.Error(\"请求异常\", \"request_id\", c.GetString(\"requestID\"))\n\t\tfail(c, 500, \"内部错误\")\n\t}))\n\trouter.Use(func(c *gin.Context) {\n\t\tvar bytes [16]byte\n\t\tif _, err := rand.Read(bytes[:]); err != nil {\n\t\t\tfail(c, 500, \"初始化请求失败\")\n\t\t\treturn\n\t\t}\n\t\tid := hex.EncodeToString(bytes[:])\n\t\tc.Set(\"requestID\", id)\n\t\tc.Header(\"X-Request-ID\", id)\n\t\tc.Header(\"X-Content-Type-Options\", \"nosniff\")\n\t\tc.Request.Body = http.MaxBytesReader(c.Writer, c.Request.Body, 16\u003c\u003c10)\n\t\tstarted := time.Now()\n\t\tc.Next()\n\t\tslog.Info(\"request\", \"id\", id, \"method\", c.Request.Method, \"route\", c.FullPath(), \"status\", c.Writer.Status(), \"duration\", time.Since(started))\n\t})\n\trouter.NoRoute(func(c *gin.Context) { fail(c, 404, \"路由不存在\") })\n\trouter.NoMethod(func(c *gin.Context) { fail(c, 405, \"请求方法不支持\") })\n\trouter.GET(\"/healthz\", func(c *gin.Context) { c.JSON(200, gin.H{\"status\": \"ok\"}) })\n\trouter.GET(\"/readyz\", func(c *gin.Context) {\n\t\tpool, err := db.DB()\n\t\tif err != nil {\n\t\t\tfail(c, 503, \"数据库未就绪\")\n\t\t\treturn\n\t\t}\n\t\tctx, cancel := context.WithTimeout(c.Request.Context(), time.Second)\n\t\tdefer cancel()\n\t\tif err := pool.PingContext(ctx); err != nil {\n\t\t\tfail(c, 503, \"数据库未就绪\")\n\t\t\treturn\n\t\t}\n\t\tc.JSON(200, gin.H{\"status\": \"ready\"})\n\t})\n\tapi := router.Group(\"/api/v1\")\n\tapi.POST(\"/auth/register\", a.register)\n\tapi.POST(\"/auth/login\", a.login)\n\tnotes := api.Group(\"/notes\", a.authenticate())\n\tnotes.GET(\"\", a.listNotes)\n\tnotes.POST(\"\", a.createNote)\n\tnotes.GET(\"/:id\", a.getNote)\n\tnotes.PATCH(\"/:id\", a.updateNote)\n\tnotes.DELETE(\"/:id\", a.deleteNote)\n\treturn router, nil\n}\n"}</script>

<script id="course">
const stages = [
 {title:'入门 · 写出第一个 API',description:'先跑通请求，再理解框架',icon:'code',ids:['start','hello','routes','binding','responses']},
 {title:'进阶 · 理解请求链路',description:'中间件、上下文与工程结构',icon:'layers',ids:['middleware','context','architecture','config','errors']},
 {title:'数据 · 从内存到持久化',description:'GORM、分页、事务与迁移',icon:'box',ids:['gorm','models','pagination','transactions','migrations']},
 {title:'安全 · 让权限真正生效',description:'密码、JWT、数据隔离与上传',icon:'shield',ids:['password','jwt','ownership','security','upload']},
 {title:'工程 · 面向真实流量',description:'跨域、缓存、测试与可观测性',icon:'bolt',ids:['cors','caching','testing','performance','observability']},
 {title:'交付 · 完整项目实战',description:'运行、读源码、验收与部署',icon:'layers',ids:['project-run','project-code','project-test','deploy','graduate']}
];
const S = (title,html,code='',lang='Go · 需放入对应上下文') => ({title,html,code,lang});
const Q = (question,options,correct,why) => ({question,options,correct,why});
const L = (id,title,minutes,intro,sections,task,answer,quiz,pitfall,source='https://gin-gonic.com/en/docs/') => ({id,title,minutes,intro,sections,task,answer,quiz,pitfall,source});
const lessons = [
 L('start','认识 Gin 与版本准备',25,'Gin 负责把 HTTP 请求匹配到处理函数，提供参数绑定、中间件和响应渲染。它不是数据库、登录系统或部署平台。这本续册默认你已经理解 Go 函数、结构体、错误与 HTTP。',[
 S('先确认学习前提','<p>能读懂 <code>func</code>、指针和结构体，知道 GET/POST、状态码与 JSON，就可以开始。遇到语言语法困难时，先回到 Go 基础。课程按“接口 → 请求链路 → 数据 → 安全 → 工程 → 交付”推进，每章都包含练习和自检。</p>'),
 S('锁定复现基线','<p>本书使用 <strong>Gin 1.12.0 / Go 1.25+ / GORM 1.31.1 / JWT v5.3.1</strong>。Gin 1.12.0 的 go.mod 要求 Go 1.25.0。旧版 Go 开启自动工具链时可能下载新版本，需要网络。版本是课程复现基线，公网发布前还要检查安全修复与依赖审计。</p>','go version\nmkdir gin-first\ncd gin-first\ngo mod init example.com/gin-first\ngo get github.com/gin-gonic/gin@v1.12.0','终端'),
 S('源码片段与完整项目怎么使用','<p>标为“片段”的代码需放入对应上下文，不是完整文件。第 26 章起的任务管理项目提供完整 ZIP：解压、设置密钥、建表、运行即可。代码和手册可离线阅读，首次下载依赖仍需联网。浏览器实验是教学模拟，不会真正运行 Go 或访问你的数据库。</p>')
 ],'执行 go version，初始化 gin-first，并确认 go.mod 中的 Gin 版本。','执行 go list -m github.com/gin-gonic/gin；应输出 v1.12.0。若安装失败，先查看第一条错误：是 Go 版本、模块代理还是网络证书。不要关闭证书校验来绕过错误。',Q('Gin 1.12.0 的最低 Go 版本是？',['Go 1.18','Go 1.25','任意版本'],1,'这是此版本模块声明的要求，应以锁定版本的 go.mod 为准。'),'不要把旧教程的版本要求直接套到当前 Gin，也不要一开始就 go get -u 更新所有依赖。','https://gin-gonic.com/en/docs/quickstart/'),
 L('hello','第一个 Gin 服务',25,'先让一个接口返回正确结果，再逐行理解它。把 Gin 看作符合 net/http.Handler 的路由器，你就能继续使用标准库服务器、超时和测试工具。',[
 S('创建完整 main.go','<p>在 gin-first 目录保存下列代码。它只监听本机，便于学习；设置可信代理为空，避免直接相信客户端伪造的代理头。</p>','package main\n\nimport (\n    "log"\n    "net/http"\n    "github.com/gin-gonic/gin"\n)\n\nfunc main() {\n    r := gin.Default()\n    if err := r.SetTrustedProxies(nil); err != nil { log.Fatal(err) }\n    r.GET("/ping", func(c *gin.Context) {\n        c.JSON(http.StatusOK, gin.H{"message": "pong"})\n    })\n    if err := r.Run("127.0.0.1:8080"); err != nil { log.Fatal(err) }\n}','main.go · 完整示例'),
 S('运行并验证','<p>执行后，打开 <code>http://127.0.0.1:8080/ping</code>，应看到 message 为 pong。Ctrl+C 停止。<code>nomsgpack</code> 关闭本课不使用的 MsgPack 功能，后续项目保持同一标记。</p>','go mod tidy\ngo run -tags=nomsgpack .','终端'),
 S('Default 与 New 的区别','<p><code>gin.Default()</code> 默认带 Logger 和 Recovery；<code>gin.New()</code> 不带这些中间件。Recovery 帮助服务从 handler 的 panic 恢复，但不能代替 error 处理，也不能恢复其他 goroutine 的 panic。正式项目用 http.Server 显式设置超时，见部署章。</p>')
 ],'增加 GET /hello，返回 {"message":"Hello Gin"}，然后请求不存在的路径观察状态码。','r.GET("/hello", func(c *gin.Context) {\n    c.JSON(200, gin.H{"message":"Hello Gin"})\n})\n// 应在 r.Run 之前注册。未知路径默认返回 404。',Q('gin.New() 默认包含 Logger/Recovery 吗？',['都包含','都不包含','只有 Logger'],1,'需要显式 Use；Default 才默认安装二者。'),'不要漏掉 Run 的错误，也不要在 Run 之后继续注册路由。','https://gin-gonic.com/en/docs/quickstart/'),
 L('routes','路由、参数与分组',35,'路由由 HTTP 方法和路径共同确定。同一个路径可以用不同方法表达查询或创建；路径参数用于标识资源，查询参数用于筛选和分页。',[
 S('Param 与 Query','<p><code>c.Param</code> 获取路径占位符，<code>c.Query</code> 获取查询字符串，<code>c.DefaultQuery</code> 提供缺省值。得到的都是文字；需要数字时要解析并检查错误，不可把失败当成 ID=0。</p>','r.GET("/users/:id", func(c *gin.Context) {\n    id, err := strconv.ParseUint(c.Param("id"), 10, 32)\n    if err != nil || id == 0 { c.JSON(400, gin.H{"error":"bad id"}); return }\n    c.JSON(200, gin.H{"id":id, "tab":c.DefaultQuery("tab", "profile")})\n})'),
 S('按边界分组，而非按文件分组','<p><code>Group("/api/v1")</code> 表达版本前缀，再为需要登录的子组安装认证。公开的注册登录不应被误放进受保护分组。资源 ID 命名尽量一致；避免混合 /user/:id 与 /users/:uid 造成接口理解成本。</p>','v1 := r.Group("/api/v1")\nv1.POST("/auth/login", login)\nprivate := v1.Group("/notes", authenticate())\nprivate.GET("", listNotes)\nprivate.GET("/:id", getNote)'),
 S('通配符与方法边界','<p><code>*filepath</code> 是通配路径，常用于静态资源，不应抢占业务路由。Gin 路由注册存在冲突限制，发现冲突应调整路径设计。启用 <code>HandleMethodNotAllowed</code> 并配置 NoMethod，能让已存在路径上的错误方法返回 405。</p>')
 ],'设计 /api/v1/articles 的列表、创建、详情、更新、删除接口，并标明方法。','GET /api/v1/articles\nPOST /api/v1/articles\nGET /api/v1/articles/:id\nPATCH /api/v1/articles/:id\nDELETE /api/v1/articles/:id',Q('GET /notes/12?page=2 中，12 和 page 分别来自？',['Query、Param','Param、Query','都来自请求正文'],1,'路径占位符由 Param 读取，问号后的参数由 Query 或 ShouldBindQuery 处理。'),'不要只因“有 token”就允许操作所有 :id；数据权限需要单独检查。','https://gin-gonic.com/en/docs/routing/grouping-routes/'),
 L('binding','参数绑定与校验',40,'绑定把输入转换成结构体，校验限制字段是否合法，业务规则则判断当前操作是否允许。三者不能互相代替。',[
 S('请求 DTO 与 ShouldBindJSON','<p>为输入单独定义 DTO，不要直接绑定数据库模型。<code>ShouldBindJSON</code> 返回错误，由你选择状态码；<code>BindJSON</code> 可能提前写入 400，之后再改响应会产生冲突。</p>','type CreateNoteInput struct {\n    Title string `json:"title" binding:"required,max=120"`\n}\nvar input CreateNoteInput\nif err := c.ShouldBindJSON(&input); err != nil {\n    c.JSON(400, gin.H{"error":"字段无效"})\n    return\n}\ninput.Title = strings.TrimSpace(input.Title)\nif input.Title == "" { /* 返回 400 并 return */ }'),
 S('缺失、false 与 null','<p>PATCH 的 <code>bool</code> 零值无法区分“没传”和“传了 false”。使用 <code>*bool</code>，nil 表示未提供、非 nil 表示明确更新。JSON null 也会映射为 nil；若需要区分 null 与缺失，需要自定义可空 DTO 类型。required 对 bool 的 false 也可能判定为空值，不适合直接表达这个场景。</p>','type PatchNoteInput struct {\n    Title *string `json:"title" binding:"omitempty,max=120"`\n    Done  *bool   `json:"done"`\n}'),
 S('正文限制与解码边界','<p>先用 <code>http.MaxBytesReader</code> 限制正文，再进行绑定。启动时开启 DisallowUnknownFields 可拒绝未知字段。标准 ShouldBindJSON <strong>不保证拒绝尾随第二个 JSON 对象</strong>；严格单文档协议需要自定义 decoder，解码一次后再 Decode 并确认 io.EOF，然后显式调用绑定校验器。这个边界在完整项目 README 中也有标注。</p>')
 ],'构造空标题、title 为数字、额外 owner_id 和超长正文四种请求，记录预期状态码。','四类请求都应拒绝，教学项目返回 400。分别检查字段校验、JSON 类型、未知字段和正文大小；不要把解码器原始错误原样暴露给客户端。',Q('PATCH 想区分未传 done 和 done=false，应使用？',['bool','*bool','字符串 true/false'],1,'指针表达字段是否出现，但 null 与缺失还需额外建模。'),'字符串 max 通常按字符校验，bcrypt 的 72 限制却按字节，不能混为一谈。','https://gin-gonic.com/en/docs/binding/binding-and-validation/'),
 L('responses','响应契约与 REST 语义',30,'稳定的接口让前端和测试少猜测。明确成功响应、业务错误、状态码以及分页格式，比给所有结果随意包一层 code=0 更有帮助。',[
 S('明确成功与失败','<p>创建返回 201，读取/更新返回 200，删除可返回 204 且无正文。400 表示请求不合法，401 表示未认证，403 表示已认证但无权，404 表示不可见或不存在的资源，409 表示状态冲突，500 表示内部故障。不要所有响应都返回 200。</p>'),
 S('只返回必要字段','<p>响应 DTO 与模型分离，避免密码哈希、内部标记和软删除信息泄漏。分页固定为 items、total、page、size；空列表返回 []，使客户端不必同时处理 null 和数组。</p>','type NoteView struct {\n    ID uint `json:"id"`\n    Title string `json:"title"`\n    Done bool `json:"done"`\n}\nc.JSON(201, NoteView{ID:note.ID, Title:note.Title, Done:note.Done})'),
 S('PUT 与 PATCH 的约定','<p>PUT 通常代表完整替换，PATCH 代表部分修改。本项目使用 PATCH；对“未提供字段”保持原值。错误统一为 <code>{"error":{"message":"…"}}</code>；日志用请求 ID 关联，而不是把内部 SQL 错误传给用户。</p>')
 ],'给“邮箱已注册”和“任务删除成功”分别选状态码，解释是否带正文。','邮箱已注册：409，带可理解的 error.message。删除成功：204，不发送 JSON 正文。',Q('HTTP 204 响应应该有 JSON 正文吗？',['可以任意返回','不应该','必须包含 success:true'],1,'204 表示成功且无响应内容。'),'响应一旦写入就不能可靠地重设状态码；错误分支写完后立即 return。'),
 L('middleware','中间件与洋葱执行顺序',45,'中间件适合处理日志、认证、请求标识等横切逻辑。理解 Next、Abort 与 return 的差别，才能避免认证失败后仍写入数据。',[
 S('Next 前后分别做什么','<p>中间件在 c.Next 前执行前置工作，在返回后执行收尾工作。假设 A、B、handler 依次注册，常见的观察顺序是 A-before → B-before → handler → B-after → A-after。不是所有中间件都会调用 Next，也不是每个场景都应依赖收尾顺序。</p>','func RequestTimer() gin.HandlerFunc {\n    return func(c *gin.Context) {\n        started := time.Now()\n        c.Next()\n        log.Printf("status=%d duration=%s", c.Writer.Status(), time.Since(started))\n    }\n}'),
 {title:'请求链路实验室',html:'<p>浏览器模拟：选择认证是否通过，逐步观察后续 handler 是否执行。下面展示的是教学事件序列，不是实际 Go 调度。</p>',widget:'middleware'},
 S('Abort 不等于 return','<p><code>c.Abort()</code> 阻止后续 handler，<strong>不会终止当前 Go 函数</strong>。拒绝后写 <code>c.AbortWithStatusJSON(...); return</code>。已执行中间件的收尾逻辑仍可能继续。认证失败却只 c.JSON 后继续，是常见越权来源。</p>')
 ],'写一个拒绝缺失 Authorization 请求的中间件，并确保后续计数器不会增加。','return func(c *gin.Context) {\n    if c.GetHeader("Authorization") == "" {\n        c.AbortWithStatusJSON(401, gin.H{"error":"需要登录"})\n        return\n    }\n    c.Next()\n}\n// 此练习只检查“存在”；真实 token 校验见 JWT 章。',Q('Abort 之后，当前函数还会继续吗？',['不会，等价于 return','会，除非显式 return','只有 Debug 模式会'],1,'Abort 控制 Gin 的 handler 链，return 控制当前函数。'),'不要用错误的示例“token 不为空”替代真正的签名与声明验证。','https://gin-gonic.com/en/docs/middleware/custom-middleware/'),
 L('context','Gin Context 与请求取消',35,'*gin.Context 是请求处理容器，context.Context 是标准库的超时与取消协议。它们名称相近，职责不同；业务层通常接收标准 context.Context。',[
 S('向下传递标准上下文','<p>handler 从 <code>c.Request.Context()</code> 取得上下文，传给 service，再传给数据库或 HTTP 客户端。客户端断开或服务设置期限时，下游可协作退出。</p>','ctx, cancel := context.WithTimeout(c.Request.Context(), 2*time.Second)\ndefer cancel()\nerr := db.WithContext(ctx).Where("owner_id = ?", uid).Find(&notes).Error\nif err != nil { /* 记录分类错误，返回合适的响应 */ }'),
 S('不要长期保存 c','<p>Gin 会复用 Context。不要让后台 goroutine 在请求结束后继续读写原 c。只读场景可按官方指导使用 Copy，但 Copy 不允许你在后台继续安全写 HTTP 响应。更好的后台任务是复制必要值后入队，由独立 worker 管理生命周期。</p>'),
 S('取消不是强制杀死','<p>context 通知取消，任务必须响应。不要把调用方 ctx 替换成 Background，也不要在业务层随意发起无人管理的 goroutine。真正需要脱离请求的任务，应有队列、重试、超时和幂等策略，而不是假装请求会一直存在。</p>')
 ],'把数据库查询限制为 500ms，解释 defer cancel 的作用。','ctx, cancel := context.WithTimeout(c.Request.Context(), 500*time.Millisecond)\ndefer cancel()\n// cancel 释放关联资源；即使查询提前完成也应调用。',Q('业务 service 更适合接收哪一个上下文？',['*gin.Context','context.Context','全局单例 Context'],1,'标准 context 不依赖 Web 框架，便于测试和复用。'),'不要跨请求共享同一个 Gin Context。','https://gin-gonic.com/en/docs/server-config/context-and-cancellation/'),
 L('architecture','项目分层与依赖方向',40,'分层的目标是隔离变化，不是让一个 CRUD 必须经过十个文件。先把输入输出和业务规则分开，等复杂度出现再拆接口。',[
 S('最小可维护结构','<p>完整项目采用同一包的多个文件，方便初学者看全链路：main 生命周期、config 配置、router 路由与中间件、auth 认证、handlers 业务入口、models 数据。它不是完整领域驱动架构；职责变复杂后再拆 internal。</p>','gin-quest-project/\n├── main.go / config.go / router.go\n├── auth.go / handlers.go / models.go\n├── main_test.go\n├── cmd/key/main.go\n├── go.mod / go.sum\n└── Dockerfile / README.md','目录'),
 S('复杂项目的扩展方向','<p>handler 负责绑定输入、调用用例、映射响应；service 负责规则与事务边界；repository 负责持久化查询。依赖从入口指向业务，再指向所需的抽象。不要让 repository 返回 *gin.Context，也不要让业务服务主动写 HTTP。</p>'),
 S('在真正需要时抽接口','<p>使用处定义小接口，按所需能力命名，例如 NoteReader。数据库集成测试可直接连接临时 SQLite；不必为了 mock 给每个结构体创建一模一样的大接口。需要证明 SQL 行为时，纯 mock 不能替代真实数据库测试。</p>')
 ],'把“标题不能为空”和“用户只能改自己的任务”分别分配到哪层？','格式层在 handler 做基础校验；标题规范也可在 service 统一保护，避免其他入口绕过。归属权限是业务规则；repository 的 WHERE owner_id 再落实过滤。',Q('层数越多，项目一定越好吗？',['是','否，应按职责与复杂度拆分','至少需要七层'],1,'额外的转发层可能增加理解成本，关键是边界是否清晰。'),'不要把“放进 service 文件”误当成业务规则已经被正确保护。'),
 L('config','配置、密钥与环境隔离',30,'配置应可校验、可追踪，敏感值不应进入仓库。程序启动时发现错误，比上线后第一个请求才报错更好。',[
 S('环境变量与启动校验','<p>项目读取 ADDR、DB_PATH、JWT_SECRET，且不自动读取 .env。密钥少于 32 字节时拒绝启动。长度只是最低门槛，必须由密码学随机源生成，重复字符并不安全。默认地址仅监听本机。</p>','type Config struct {\n    Addr string\n    DBPath string\n    Secret []byte\n}\n// 配置读取与错误处理见源码 config.go。'),
 S('生成并保存密钥','<p>项目自带 cmd/key，输出随机密钥。首次设置后应安全保存并在重启时复用；更换密钥会使旧 token 失效。不要把 token、密码或连接串打印进日志。</p>','$env:JWT_SECRET = go run ./cmd/key\n$env:ADDR = "127.0.0.1:8080"\n$env:DB_PATH = "quest.db"','PowerShell'),
 S('本地、测试与生产分开','<p>测试使用临时数据库和明确标识的测试密钥；生产从部署平台注入独立密钥。分离数据库账户与权限；用最小权限原则控制迁移账户和应用账户。环境变量不是万能保险，仍须管理进程权限与日志访问。</p>')
 ],'移除 JWT_SECRET 再启动，确认应用明确失败而不是退回默认密钥。','PowerShell：Remove-Item Env:JWT_SECRET -ErrorAction SilentlyContinue\ngo run -tags=nomsgpack .\n// 应返回启动错误。再恢复安全密钥，不要提交它。',Q('源码里配置默认 JWT 密钥作为 fallback 合理吗？',['合理，方便部署','不合理，应缺失即失败','只要名字叫 secret 就安全'],1,'默认密钥容易被带到生产且可预测。'),'不要在演示截图或错误反馈中粘贴真实 token 与密钥。'),
 L('errors','错误处理与统一响应',30,'用户需要可理解的失败结果，开发者需要定位证据。接口错误契约和内部错误链应各司其职。',[
 S('小而明确的失败出口','<p>项目的 fail 写入约定错误并 Abort；调用点依然要 return。若已写入响应再遇到编码失败，不能重新发送另一个状态码，只能记录错误。</p>','func fail(c *gin.Context, status int, message string) {\n    c.AbortWithStatusJSON(status, gin.H{\n        "error":gin.H{"message":message},\n    })\n}\n// 使用：fail(c, 400, "分页参数无效"); return'),
 S('区分领域错误与基础设施故障','<p>查无数据可映射 404，邮箱冲突为 409，数据库不可用通常属于服务端故障。不要将所有 db.Error 都变成 404，也不要将 SQL、文件绝对路径、堆栈直接返回给客户端。service 可用 errors.Is 传递可分类的错误。</p>'),
 S('Recovery 只做最后一道边界','<p>主动检查返回的 error，不用 panic 表达常规校验失败。异常恢复后服务仍能接收请求，不代表本次业务已正确回滚。涉及部分写入的流程应通过事务保护，外部副作用还需要额外的一致性设计。</p>')
 ],'写一条失败查询：任务不存在返回 404，数据库连接失效返回 500/503，确保区别。','先 errors.Is(err, gorm.ErrRecordNotFound)；再 if err != nil 处理故障；只有 nil 才返回成功对象。',Q('数据库故障返回 404 会带来什么问题？',['没有问题','把服务端故障误报为资源不存在','能自动修复数据库'],1,'这会误导用户、客户端重试和监控判断。'),'不要“打印错误后继续执行成功逻辑”。'),
 L('gorm','GORM 与 SQLite 持久化',45,'GORM 帮助组织模型和查询，但 SQL、索引、连接池与事务仍需理解。完整项目用 SQLite 让你零配置起步，后续再迁移 PostgreSQL。',[
 S('连接一次，复用连接池','<p>项目使用 glebarez 的纯 Go SQLite 驱动，不依赖 C 编译器。openDB 返回长期复用的 *gorm.DB，底层 *sql.DB 是连接池，退出时关闭。SQLite 单连接是教学取舍，不能直接代表生产高吞吐方案。</p>','db, err := gorm.Open(sqlite.Open("quest.db"), &gorm.Config{})\nif err != nil { return err }\npool, err := db.DB()\nif err != nil { return err }\npool.SetMaxOpenConns(1)\ndefer pool.Close()'),
 S('先建表，再启动服务','<p>项目提供 -migrate 开关，调用 AutoMigrate 后退出。正常启动不悄悄修改表结构。数据库文件位于工作目录，可用 DB_PATH 指定路径；父目录须存在并可写。重启后数据仍在，而不是依靠内存 map。</p>','go run -tags=nomsgpack . -migrate\ngo run -tags=nomsgpack .','终端（已设置 JWT_SECRET）'),
 S('数据库能力与框架能力分开','<p>Gin 不自带 ORM，GORM 也不属于 Gin 的运行要求。教学项目的 SQLite 驱动是第三方组件，版本已锁定；迁移 PostgreSQL 要更换驱动、连接配置、部署与数据库集成测试，不能只改一个文件后声称生产可用。</p>')
 ],'创建任务，停止服务，再用同一个 DB_PATH 重启，验证任务仍可查询。','不要重新执行删除数据库的操作；继续使用相同用户与密钥登录。用相同 DB_PATH 查询原任务；若看不到，检查程序启动目录是否改变。',Q('*gorm.DB 底层的 *sql.DB 通常代表？',['单条记录','连接池','浏览器会话'],1,'通常在应用启动创建并复用，不要每个请求重新 Open。'),'不要把 SQLite 的并发和锁行为当作 PostgreSQL 的行为。','https://gorm.io/docs/connecting_to_the_database.html'),
 L('models','模型、更新与软删除',40,'模型字段不仅描述 Go 数据，还影响数据库约束。更新时要特别注意零值；删除时要知道数据是否真的被移除。',[
 S('约束要落到数据库','<p>Email 唯一性不能只靠“先查询再插入”，并发注册会竞争。使用 uniqueIndex 和冲突处理，数据库才是最终裁判。请求不能绑定 OwnerID；归属来自已验证的身份。</p>','type User struct {\n    ID uint `gorm:"primaryKey"`\n    Email string `gorm:"uniqueIndex;not null"`\n    PasswordHash string `json:"-"`\n}'),
 S('false 更新的陷阱','<p>传统 GORM 使用结构体 Updates 默认可能跳过零值，导致 done 从 true 改为 false 失效。项目通过指针 DTO 检查字段是否出现，再使用 map Updates，明确包含 false。不要用 Save 无意触发插入或覆盖未提交的字段。</p>','updates := make(map[string]interface{})\nif input.Done != nil { updates["done"] = *input.Done }\nresult := db.Model(&Note{}).Where("id = ? AND owner_id = ?", id, uid).Updates(updates)\n// 检查 result.Error 与 RowsAffected。'),
 S('软删除不是数据销毁','<p>包含 gorm.DeletedAt 的模型使用 Delete 时通常更新 deleted_at，常规查询自动排除软删除记录。管理员恢复/清理需要额外授权；Unscoped 可绕过过滤，不应暴露给普通用户。隐私删除、唯一索引复用和备份保留要单独设计。</p>')
 ],'运行项目，将同一任务 done 设为 true，再设为 false，确认两次都生效。','PATCH /api/v1/notes/:id\n{"done":true}\n// 再 PATCH\n{"done":false}\n// 查询结果应为 false。',Q('Updates(struct) 更新 bool=false 时需要注意？',['可能跳过零值','会自动变 true','会删除记录'],0,'使用 map 或 Select 显式选择字段，并编写零值回归测试。'),'软删除后的“查不到”不等于数据已被物理删除。','https://gorm.io/docs/update.html'),
 L('pagination','分页、筛选与查询边界',35,'无限制列表会消耗内存、数据库与网络。分页既是接口体验，也是资源管理策略；输入边界与排序稳定性都要明确。',[
 S('先校验分页参数','<p>项目默认 page=1、size=10，限制 size≤100 和 page≤100000。不要直接把用户提供的超大数字传进 Limit/Offset。空列表固定返回 []，total 只统计当前用户可见数据。</p>','var query struct {\n    Page int `form:"page,default=1" binding:"min=1,max=100000"`\n    Size int `form:"size,default=10" binding:"min=1,max=100"`\n}\nif err := c.ShouldBindQuery(&query); err != nil { /* 返回 400 */ }'),
 S('固定排序与归属条件','<p>Count 和 Find 都要有 owner_id 条件，排序固定为 id DESC。动态排序字段不能直接拼接用户输入，应通过白名单映射。参数占位符保护值，不会自动保护表名、列名和排序片段。</p>','base := db.WithContext(ctx).Model(&Note{}).Where("owner_id = ?", uid)\nif err := base.Count(&total).Error; err != nil { return err }\nerr := base.Order("id DESC").Limit(size).Offset((page-1)*size).Find(&notes).Error'),
 S('偏移分页与游标分页','<p>深分页可能扫描较多数据；游标分页可用 id&lt;lastID 配合索引。游标应绑定筛选/排序语义，客户端不能假定可任意跳页。教学项目 Count 与 Find 是两次查询，并发变化时 total 和 items 可能暂时不一致，不声称是快照结果。</p>')
 ],'以另一个用户的身份查询列表，确认 total 不包含第一个用户的任务。','注册 A/B，A 创建 2 条，B 创建 1 条；分别查询。A.total=2，B.total=1，items 内不得出现对方内容。',Q('用户传来的 sort 能直接传给 Order 吗？',['能，有 ORM 就安全','不能，应使用允许字段映射','只检查非空即可'],1,'ORM 不会自动使任意 SQL 片段安全。'),'SQL 注入防护不等于权限过滤；两者都要做。','https://gorm.io/docs/query.html'),
 L('transactions','事务、一致性与并发更新',45,'事务让一组数据库操作一起提交或回滚。它不能回滚已经发送的邮件，也不能自动解决并发覆盖和重复请求。',[
 S('让边界覆盖完整业务动作','<p>例如“创建任务 + 创建审计记录”需要一起成功，可以在 service 内用 Transaction。回调中始终使用 tx，而不是外层 db；返回 error 会回滚，返回 nil 会尝试提交，最外层仍要检查返回错误。</p>','err := db.WithContext(ctx).Transaction(func(tx *gorm.DB) error {\n    if err := tx.Create(&note).Error; err != nil { return err }\n    audit := Audit{ActorID:uid, Action:"note.created", NoteID:note.ID}\n    return tx.Create(&audit).Error\n})\n// Audit 是扩展模型；完整项目未实现审计表。'),
 S('识别丢失更新','<p>两个人读取同一版本再更新，后写入可能覆盖先写入。项目 PATCH 采用最后写入生效，未实现版本冲突检测。若需要乐观锁，增加 version 字段并用 WHERE id=? AND version=? 更新，RowsAffected=0 返回 409，再让客户端处理冲突。</p>'),
 S('外部副作用与幂等','<p>发邮件、调用支付或发布消息不在数据库本地事务里。更可靠的模式是事务中写 Outbox，再由 worker 可靠投递，消费端也应幂等。幂等键需要存储、唯一约束、请求内容摘要和结果复用，不能只是内存里记一次。</p>')
 ],'为“创建任务 + 写审计”设计一个失败场景，确认任务也回滚。','在同一事务中创建任务，然后让审计插入返回人为错误。回调返回错误后，重新查询任务应不存在。不要在生产注入故障；使用隔离测试数据库。',Q('数据库事务能回滚已经发送的邮件吗？',['能','不能','开启 GORM 后自动支持'],1,'邮件属于外部副作用，需要额外的一致性与重试方案。'),'在事务里执行慢网络调用会长期占用连接和锁。','https://gorm.io/docs/transactions.html'),
 L('migrations','数据库迁移与演进',35,'数据库结构是长期契约。学习期可以用 AutoMigrate 快速起步，生产需要明确的版本化步骤、执行顺序、锁影响与回退策略。',[
 S('AutoMigrate 的适用边界','<p>本项目 -migrate 只用于教学建表，不能当成完整生产迁移工具。版本化迁移应记录编号、内容和执行状态，由单独步骤运行，避免多个应用副本同时改表。上线前在具有代表性的数据量上评估锁与耗时。</p>'),
 S('扩展—迁移—收缩','<p>例如把 title 改成 name：先添加新列，应用兼容读写，回填历史数据，确认后切读路径，最后再删旧列。不要在滚动发布时先删除旧实例还依赖的列。数据库 schema 兼容性是二进制回滚的前提。</p>'),
 S('迁移到 PostgreSQL','<p>扩展时可采用 GORM PostgreSQL 驱动。连接池、TLS、唯一冲突行为、时区和事务隔离都应重新验证；SQLite 测试通过不证明 PostgreSQL 行为完全相同。</p>','// 扩展片段：需要单独添加 gorm.io/driver/postgres 依赖。\ndb, err := gorm.Open(postgres.Open(os.Getenv("DATABASE_URL")), &gorm.Config{})\n// 检查 err；配置连接池；运行 PostgreSQL 集成测试。','扩展片段 · 非当前项目配置')
 ],'设计新增 priority 字段的迁移顺序，确保旧版应用仍可运行。','先新增有合理默认值的列，部署兼容代码，分批回填并验证，再启用新功能。需要约束时评估历史数据是否满足；回退不得依赖已经删除的数据。',Q('SQLite 集成测试通过是否足够证明 PostgreSQL 行为正确？',['足够','不够，需目标数据库测试','只要 ORM 一样就够'],1,'锁、类型、SQL 方言和事务行为可能不同。'),'先备份并验证恢复，再做不可逆的结构或数据变更。','https://gorm.io/docs/migration.html'),
 L('password','注册、登录与密码哈希',40,'密码不能明文存储，也不能简单 SHA256 后当成安全哈希。项目使用 bcrypt，限制输入字节数，并避免把密码哈希作为响应返回。',[
 S('注册时哈希，登录时比较','<p>bcrypt 包含工作因子与盐。GenerateFromPassword 负责生成哈希，CompareHashAndPassword 负责验证，不要自行生成固定盐。该算法有 72 字节输入限制；项目要求 12–72 字节，这是教学策略，真实产品还需独立制定口令政策。</p>','hash, err := bcrypt.GenerateFromPassword([]byte(input.Password), bcrypt.DefaultCost)\nif err != nil { return err }\n// 仅保存 string(hash)；登录时：\nerr = bcrypt.CompareHashAndPassword([]byte(user.PasswordHash), []byte(input.Password))'),
 S('冲突交给唯一约束裁决','<p>Email 在进入数据库前统一小写，数据库 uniqueIndex 保证唯一。项目使用 OnConflict DoNothing，再检查 RowsAffected；并发重复注册也不依赖“先查再插”保证正确。返回 409 的同时，也要评估业务是否接受注册状态可被枚举。</p>'),
 S('登录失败与资源滥用','<p>不存在用户与错误密码都返回相同 401；项目用 dummy hash 减少“完全不计算哈希”的时间差，但不承诺恒定时间。登录接口是 CPU 密集入口，公网前必须补充限流、防爆破、账号恢复与安全审计。不要为了演示便利返回“此邮箱不存在”。</p>')
 ],'发送正确邮箱错误密码、未知邮箱两种登录请求，比较响应内容。','两者都应返回 401 和“邮箱或密码错误”。不要把详细原因暴露给客户端；运维日志也不得记录明文密码。',Q('bcrypt 的 72 限制按什么计算？',['Unicode 字符数','字节数','行数'],1,'中文等字符可能占多个 UTF-8 字节。'),'不要在每次请求里生成新的密钥，也不要把哈希值误当成可以公开的内容。','https://pkg.go.dev/golang.org/x/crypto/bcrypt'),
 L('jwt','JWT 签发、验证与过期',50,'JWT 是带签名的声明载体，常见格式不是加密。能解码 payload 不代表能伪造有效签名；签名有效也不等于业务权限正确。',[
 S('短期 access token 的字段','<p>本项目 HS256、15 分钟有效期：sub 为用户 ID，iss 为 gin-quest，aud 为 gin-quest-client，iat 为签发时间，exp 为过期时间。客户端用 Authorization: Bearer 发送。不要在 payload 放密码、密钥或敏感资料。</p>','claims := jwt.RegisteredClaims{\n    Subject:strconv.FormatUint(uint64(user.ID),10),\n    Issuer:"gin-quest", Audience:jwt.ClaimStrings{"gin-quest-client"},\n    IssuedAt:jwt.NewNumericDate(now),\n    ExpiresAt:jwt.NewNumericDate(now.Add(15*time.Minute)),\n}\ntoken, err := jwt.NewWithClaims(jwt.SigningMethodHS256, claims).SignedString(secret)'),
 S('固定算法并校验声明','<p>不能相信 token 自报的算法选择，必须限制允许的方法。项目要求 exp，校验 issuer、audience、iat 与签名，再检查 sub 可解析且用户仍存在。JWT 库不会替你做数据归属权限。</p>','token, err := jwt.ParseWithClaims(raw, &claims, keyFunc,\n    jwt.WithValidMethods([]string{"HS256"}),\n    jwt.WithIssuer("gin-quest"),\n    jwt.WithAudience("gin-quest-client"),\n    jwt.WithExpirationRequired(), jwt.WithIssuedAt(),\n)\nif err != nil || !token.Valid { /* 401 并 return */ }'),
 S('刷新与撤销是另一套设计','<p>项目不包含 refresh token、注销撤销或多设备会话管理。实现时可用随机 refresh token，数据库仅保存其哈希，轮换时原子作废旧令牌并处理重放。短期 access token 无服务端状态时，主动失效能力有限；需要 token version 或 denylist 等机制。不要把“前端删 token”当成服务端撤销。</p>')
 ],'运行测试中的过期 token 和 HS384 token，用相同密钥签名仍应被拒绝。','go test -tags=nomsgpack -run TestExpiredAndWrongAlgorithm -v\n// 同一 HMAC 密钥不意味着允许所有 HMAC 算法。',Q('JWT payload 默认是什么属性？',['任何人都不可见的密文','通常可解码，签名保护完整性','浏览器数据库'],1,'常见 JWS 不提供内容保密；传输必须使用安全通道。'),'不要仅 Base64 解码后相信 sub；必须完整验证签名与声明。','https://pkg.go.dev/github.com/golang-jwt/jwt/v5'),
 L('ownership','认证、授权与数据隔离',45,'认证回答“你是谁”，授权回答“你能操作什么”。一个常见漏洞是用户 A 修改 URL 中的 ID，就能读到用户 B 的资源。',[
 S('归属从可信身份取','<p>OwnerID 来自认证中间件的用户 ID，不从请求 JSON、查询参数或隐藏表单读取。即使前端隐藏了按钮，服务端仍须验证。项目 DTO 不接受 owner_id，启用未知字段拒绝后会返回 400。</p>'),
 S('读写都带归属过滤','<p>查询、详情、更新、删除全部带 owner_id；列表 total 也要过滤。对跨用户资源统一返回 404，减少资源存在信息暴露。更新和删除的实际 SQL 仍带归属条件，避免只在先前查询时检查一次。</p>','err := db.WithContext(ctx).Where("id = ? AND owner_id = ?", id, uid).First(&note).Error\n// 更新/删除时同样绑定 owner_id。\nresult := db.Where("id = ? AND owner_id = ?", id, uid).Delete(&Note{})'),
 {title:'权限请求实验室',html:'<p>模拟 owner、other user 和未登录三种身份对某条任务的访问。这是浏览器示例数据；真正的数据隔离由下载项目的 SQLite 集成测试验证。</p>',widget:'ownership'}
 ],'为 A 的一条任务，使用 B 的 token 分别 GET、PATCH、DELETE，都应失败且任务仍存在。','项目 TestCRUDAndIsolation 已覆盖该矩阵。继续扩展批量删除、导出和搜索时，也要重新检查数据作用域。',Q('有效 JWT 是否意味着可以访问任意任务 ID？',['是','否，还必须检查资源归属','知道 ID 就可以'],1,'身份验证和资源权限是独立检查。'),'不要以“接口路径很难猜”为授权机制。'),
 L('security','输入、代理与安全边界',40,'框架默认值不等于你的部署安全策略。对外输入、代理头、正文大小、错误输出和敏感日志都需要明确边界。',[
 S('不信任未知代理头','<p>未处于可信反向代理后时，SetTrustedProxies(nil) 不信任转发来源。部署到已知代理后时，配置精确地址范围，再使用 ClientIP。若把攻击者提供的 X-Forwarded-For 当真，基于 IP 的限流、审计和风控都可能被绕过。</p>','if err := r.SetTrustedProxies(nil); err != nil { return err }\n// 真正部署在代理后，再按实际拓扑设置精确代理网段。'),
 S('把资源限制放在昂贵操作之前','<p>限制正文、上传、分页、连接、请求耗时与登录尝试。Redis 限流在多副本之间共享状态，但必须处理 Redis 故障策略、原子计数和过期。项目未实现公网限流；应先限制代理入口与登录接口，再开放外网。</p>'),
 S('安全不是某个中间件开关','<p>日志禁止记录 Authorization、password、完整连接串和敏感正文；错误响应不包含内部 SQL。TLS 保护传输，认证保护身份，授权保护资源，参数化 SQL 保护值输入。它们解决不同问题，不能互相代替。</p>')
 ],'发送伪造 X-Forwarded-For 请求，确认在不信任代理时不会把它作为可信客户端身份。','在本地临时打印 c.ClientIP（不要同时打印 token）。请求头放任意公网地址，结果仍应反映实际直连来源。完成后移除调试日志。',Q('直接信任任意 X-Forwarded-For 可能导致？',['更安全','IP 限流和审计可被伪造','数据库自动加密'],1,'只有受信任代理链可以提供可依赖的转发信息。'),'不要通过关闭 TLS 证书验证修复网络连接问题。','https://gin-gonic.com/en/docs/server-config/trusted-proxies/'),
 L('upload','文件上传与下载授权',35,'上传是把外部输入变成持久化文件的入口。原始文件名、类型声明和存储路径都不能直接相信；下载也需要权限检查。',[
 S('总大小、文件名与内容类型','<p>MaxMultipartMemory 主要控制内存阈值，<strong>不是总上传大小限制</strong>。在解析前用 MaxBytesReader 限制正文，超限时返回 413。随机生成存储键，不使用用户文件名拼路径；Content-Type 可伪造，应检测真实内容并按需要扫描。</p>','c.Request.Body = http.MaxBytesReader(c.Writer, c.Request.Body, 5<<20)\nfile, err := c.FormFile("file")\nif err != nil { /* 分类超限与格式错误，然后 return */ }\n// 用随机名称保存到受控目录；原始名称只作为经过净化的展示元数据。'),
 S('不要把上传目录当静态网站','<p>用户上传的 HTML/SVG 可能携带可执行内容。优先独立下载域、attachment 内容处置、nosniff、严格类型允许列表与对象存储权限。不要把可控路径交给 c.File，也不要直接为私有文件开放静态目录。</p>'),
 S('记录归属并验证下载','<p>保存文件元信息：owner_id、存储键、大小、媒体类型和创建时间。下载先查询元数据并授权，再提供短期下载 URL 或流式传输。清理孤儿文件与失败事务也要设计。本项目未提供上传路由，此章是后续扩展任务。</p>')
 ],'写出文件 A 上传后，用户 B 下载它时必须经过的检查。','认证 B → 按文件 ID 查元数据 → 检查 B 的授权 → 不允许则 403/404 → 允许后才能用内部存储键取文件。不能让客户端直接提交磁盘路径。',Q('MaxMultipartMemory 能直接保证总上传不超过该值吗？',['能','不能，它主要控制内存使用阈值','只限制文件名'],1,'总请求大小应在读取前限制。'),'表单给出的文件扩展名和 Content-Type 都不能直接证明内容安全。','https://gin-gonic.com/en/docs/routing/upload-file/'),
 L('cors','CORS、Cookie 与前端联调',35,'CORS 是浏览器执行的跨域读取规则，不是身份验证，也不能阻止任意脚本或服务器直接调用接口。先确定凭证存储方式，再设计跨域策略。',[
 S('开发环境的最小允许列表','<p>前端端口不同就可能跨域。Bearer token 需允许 Authorization 头，并正确响应 OPTIONS 预检。推荐审阅 gin-contrib/cors 的配置后使用，允许精确 Origin、方法与头部，避免临时写 * 之后忘记收回。</p>'),
 S('Cookie 模式额外考虑 CSRF','<p>浏览器自动附带 Cookie 时，应评估 SameSite、Secure、HttpOnly 与 CSRF 防护。跨域携带凭证不能使用 Access-Control-Allow-Origin: *。Bearer 存在哪里也有取舍：localStorage 暴露给同源 JavaScript，XSS 风险不会因用了 JWT 而消失。</p>'),
 S('区分网络、预检与权限错误','<p>先用 curl 或 PowerShell 验证服务端响应，再在浏览器 Network 面板检查 OPTIONS、状态码和 CORS 响应头。本项目默认不开放跨域：终端调用不需要 CORS；要接前端时按明确来源配置，不能把 CORS 报错“修复”为绕过认证。</p>')
 ],'说明 localhost:5173 请求 localhost:8080 为什么需要跨域配置，以及哪些工具不受 CORS 限制。','端口是 origin 的组成部分。浏览器执行 CORS；curl、PowerShell 和其他后端客户端不会因为浏览器同源策略而自动拒绝读取。服务端认证仍然适用于所有客户端。',Q('CORS 是否可以代替身份验证？',['可以','不可以','只要关闭跨域就不需要登录'],1,'CORS 约束浏览器读取，不能保护公开网络接口本身。'),'不要把 * 与 Allow-Credentials 组合当成正确跨域配置。','https://github.com/gin-contrib/cors'),
 L('caching','缓存、限流与幂等设计',40,'缓存解决读负载，限流控制消耗，幂等减少重复副作用。先有可测量的问题，再引入 Redis；引入后也必须设计失败路径。',[
 S('Cache-aside 的生命周期','<p>先读缓存，未命中再读数据库并填充，写入数据库后按策略失效。缓存键需要包含用户/租户与查询条件，不能让 A 的任务列表被 B 复用。过期时间可加入适当抖动，热点 key 需要抑制并发回源；缓存不应成为权限事实来源。</p>'),
 S('限流不是简单 count++','<p>单进程内存计数只对一个实例有效；多副本可用 Redis 原子脚本或支持的限流组件。区分用户、IP 与接口成本，登录失败限流应考虑代理信任。超限返回 429，合理设置 Retry-After；明确 Redis 不可用时是降级还是拒绝。</p>'),
 S('用持久化幂等键保护创建','<p>高价值请求可接收 Idempotency-Key，持久化“用户+key+请求摘要+处理状态+结果”，并用唯一约束保护。相同 key 不同 payload 应拒绝。项目未实现缓存/限流/幂等，不能把这些设计笔记当成已交付能力。</p>')
 ],'为 GET /notes?page=2 设计一个不会跨用户泄漏的缓存键。','例如 notes:v1:user:42:page:2:size:10:sort:id-desc。仍需先认证；用户可见范围变更时要失效，版本字段便于整体调整键结构。',Q('只用 notes:page:1 作为所有用户的列表缓存键安全吗？',['安全','不安全，会混淆用户数据','TTL 短就安全'],1,'缓存键必须覆盖数据可见范围。'),'缓存不能弥补错误的数据库权限条件。'),
 L('testing','Handler 测试与数据库集成',45,'可运行的测试让教程不止于“看起来对”。httptest 能直接调用 Gin Engine，不必占用真实端口；临时 SQLite 验证实际查询与持久化行为。',[
 S('测试请求与可观察结果','<p>构造请求、调用 ServeHTTP、检查状态码与 JSON。不要只断言“没有 panic”，也不要测试内部调用顺序来代替业务行为。本项目每个测试建立隔离数据库并在结束后关闭。</p>','rec := httptest.NewRecorder()\nreq := httptest.NewRequest("GET", "/api/v1/notes", nil)\nrouter.ServeHTTP(rec, req)\nif rec.Code != http.StatusUnauthorized {\n    t.Fatalf("got %d want 401", rec.Code)\n}'),
 S('必须覆盖的权限矩阵','<p>无 token、篡改 token、过期 token、错误算法；A 访问 A、B 访问 A；列表 total、详情、更新、删除均应检查。再加 false 零值更新、超长正文、非法分页和重复邮箱。测试应覆盖被拒绝后没有写入副作用。</p>'),
 S('运行命令与环境边界','<p>-race 检测实际执行路径的数据竞争，但平台与工具链要支持。覆盖率命令统计根目录 API 包，普通测试仍覆盖 ./...。SQLite 测试不能代替生产数据库测试，也不代表容器部署成功。本项目使用真实临时 SQLite；未来换 PostgreSQL 后应建立对应集成测试环境。</p>','go test -tags=nomsgpack -count=1 -v ./...\ngo test -tags=nomsgpack -cover .\ngo vet -tags=nomsgpack ./...\n# 受支持环境可再运行 go test -tags=nomsgpack -race ./...','终端；最后一行为可选扩展')
 ],'增加“空 PATCH 应返回 400”的回归测试，确认原记录不变。','先创建任务，然后 PATCH {}，断言 400，再 GET 同一 ID，断言 title 与 done 均未改变。可以复用 main_test.go 的 account/request 辅助函数。',Q('mock 数据库返回成功是否证明真实 SQL 条件正确？',['证明','不能，仍需集成测试','用了 Gin 就不需要'],1,'mock 可能完全绕过实际查询、约束和数据库行为。'),'不要使用生产数据库运行可写测试。','https://gin-gonic.com/en/docs/testing/'),
 L('performance','性能分析与资源预算',35,'先测量瓶颈，再选择优化。吞吐、延迟、错误率与资源消耗要一起看，单次接口很快不代表高负载仍稳定。',[
 S('测量真实工作负载','<p>定义目标：例如指定并发下 p95 延迟与错误率。区分密码哈希、数据库查询、JSON 编码、网络与队列等待。压测用隔离环境与代表性数据，不能对未知第三方服务直接加压。</p>'),
 S('先处理常见瓶颈','<p>检查索引、N+1 查询、无限列表、过量连接、长事务和未设超时。SQLite 单连接会串行化数据库访问，是本教程的可解释取舍；需要更多写并发时评估 PostgreSQL，而不是盲目把连接数调到几百。</p>'),
 S('pprof 与调试入口','<p>CPU/内存 profile 帮你定位实际热点。pprof、metrics、管理接口应在内部网络或经过授权的入口，避免暴露敏感状态。benchmark 保留环境、版本、数据规模与对照结果，不把本地数字当普遍性能承诺。</p>')
 ],'为列表接口制定一个压测实验：固定数据量、并发、持续时间、延迟和错误指标。','例：隔离测试库 1 万条数据，固定用户与分页；记录 1/10/30 并发下 60 秒的 p50/p95、错误率、CPU 和数据库等待。只改变一个变量，比较相同负载。',Q('看到延迟高时最先该做什么？',['添加更多 goroutine','收集证据定位瓶颈','把所有超时关掉'],1,'优化应基于测量与假设验证。'),'不要把未认证的 pprof 入口直接暴露到公网。','https://go.dev/doc/diagnostics'),
 L('observability','日志、健康检查与可观测性',35,'服务出错时，你需要知道哪一类请求失败、发生在哪一步、影响多少用户。结构化日志、指标与链路追踪各自提供不同证据。',[
 S('请求 ID 与安全日志','<p>项目用 crypto/rand 生成请求 ID，返回 X-Request-ID。日志记录 method、route 模式、status、duration，不记录密码、token 或正文。route 用 FullPath，避免原始 URL 中的敏感参数和高基数标签。</p>','slog.Info("request",\n    "id", requestID,\n    "method", c.Request.Method,\n    "route", c.FullPath(),\n    "status", c.Writer.Status(),\n    "duration", time.Since(started),\n)'),
 S('存活与就绪分开','<p>/healthz 表示进程可响应；/readyz 会检查数据库连接。项目的 readyz 不验证全部表结构，因此未迁移时仍可能连接成功。生产就绪检查应根据依赖、迁移状态与流量切换策略设计，不要把短暂数据库故障变成无休止重启。</p>'),
 S('从日志走向指标与追踪','<p>关注请求率、错误率、延迟分布和资源饱和度。指标标签避免用户 ID、token、原始路径等高基数数据；跨服务传递标准 trace context，采样与脱敏须明确。项目只有日志与基础健康路由，未集成 OpenTelemetry 或指标系统。</p>')
 ],'发起一次无 token 请求，从响应拿 X-Request-ID，再在终端找到对应日志。','GET /api/v1/notes 返回 401。记录 X-Request-ID，终端日志应有同一 id、route、status=401。不要为了排错记录整个 Authorization 头。',Q('进程存活和依赖就绪是否是同一件事？',['是','不是','只看 CPU 就可以'],1,'活着的进程可能暂时无法正确服务业务请求。'),'不要在指标标签中放每个用户 ID，避免高基数开销。'),
 L('project-run','实战：从空目录运行项目',60,'现在把前面内容连起来。完整项目是一个带注册登录、短期 JWT、按用户隔离任务 CRUD、分页与 SQLite 持久化的小型后端。首次依赖安装需要网络。',[
 S('下载、解压、安装','<p>点击下载完整项目 ZIP，解压后进入 gin-quest-project。先执行依赖整理与测试，再运行。不要把这些文件合并进已有 main 包，避免重复入口。</p>','go mod tidy\ngo test -tags=nomsgpack ./...','终端'),
 S('设置密钥、建表、启动','<p>Windows PowerShell 如下；macOS/Linux 的环境变量写法在 README 中。密钥首次生成后安全保留，重启时复用。-migrate 为本地教学库建表，然后退出；下一条命令启动服务。</p>','$env:JWT_SECRET = go run ./cmd/key\ngo run -tags=nomsgpack . -migrate\ngo run -tags=nomsgpack .','PowerShell'),
 S('调用一遍完整流程','<p>另开 PowerShell 终端，先注册、再登录，最后带 token 创建并查询任务。演示使用 ASCII 标题，避免旧版 PowerShell 中文请求正文编码差异。创建后的 ID 以响应为准。</p>','$base = "http://127.0.0.1:8080/api/v1"\n$body = \'{"email":"you@example.com","password":"my-long-password-123"}\'\nInvoke-RestMethod "$base/auth/register" -Method Post -ContentType "application/json" -Body $body\n$login = Invoke-RestMethod "$base/auth/login" -Method Post -ContentType "application/json" -Body $body\n$headers = @{ Authorization = "Bearer $($login.access_token)" }\nInvoke-RestMethod "$base/notes" -Method Post -Headers $headers -ContentType "application/json" -Body \'{"title":"Learn Gin"}\'\nInvoke-RestMethod "$base/notes" -Headers $headers','PowerShell')
 ],'完成注册→登录→创建→改为完成→改回未完成→删除→重启后查询。','参考 README 的 PATCH/DELETE 命令。先保留一个任务用于重启持久化检查，再删除另一条。若端口被占用，设置 ADDR 到另一本机端口，并同步修改请求地址。',Q('项目默认使用哪一种持久化？',['内存 map','SQLite 文件','浏览器 localStorage'],1,'任务和用户保存在 quest.db；浏览器只保存学习进度与笔记。'),'重复注册同一邮箱会返回 409；不是服务坏了。','https://gin-gonic.com/en/docs/quickstart/'),
 L('project-code','实战：读懂完整源码',70,'源码按职责拆成多个文件，但同属一个 Go main 包。先跟踪一条请求从哪进入、怎样校验、如何授权、在哪里写库、最终返回什么，再逐个研究细节。',[
 S('入口与路由依赖','<p>main.go 管理配置、数据库与服务器；router.go 注册路由和中间件；App 通过构造得到 db、secret 与 dummyHash，避免到处读全局环境变量。newRouter 也能直接用于 httptest。</p>'),
 S('顺着 PATCH 走一遍','<p>认证中间件验证 JWT 与用户 → findNote 按 id+owner_id 查找 → 绑定指针 DTO → 生成明确字段 map → 带归属条件 Updates → 检查 RowsAffected → 重新查询并返回 DTO。项目使用最后写入生效策略，没有版本锁。</p>'),
 {title:'源码浏览器',html:'<p>这里展示的文件与下载 ZIP 来自同一份项目内容。可以切换文件、复制代码或下载单文件；实际运行应下载完整 ZIP 并按 README 操作。</p>',widget:'source'}
 ],'在源码里找到四处 owner_id 条件，以及“密码不会进入响应”的实现。','owner_id：列表 Count/Find、findNote、更新条件、删除条件。密码：请求/模型与 NoteView 分离，注册仅返回 id/email，登录仅返回 token 元信息，PasswordHash 标注 json:"-"。',Q('为什么不把数据库模型直接作为所有输入 DTO？',['因为 Go 不支持','会允许客户端提交内部字段，增加批量赋值风险','只是为了多写文件'],1,'显式 DTO 让可写字段成为可审查的契约。'),'单文件能复制不代表它能独立运行；这个项目需要完整包。'),
 L('project-test','实战：测试与验收矩阵',55,'验收应围绕真实行为，而不是“服务启动没有报错”。测试文件提供注册登录、CRUD、归属权限、输入失败与持久化的可复现检查。',[
 S('运行自动化测试','<p>main_test.go 不占用服务器端口，每个测试使用临时 SQLite。用例检查 A 不能读/改/删 B 的数据、false 更新确实生效、错误签名算法与过期 JWT 被拒绝。</p>','go test -tags=nomsgpack -count=1 -v ./...\ngo test -tags=nomsgpack -cover .\ngo vet -tags=nomsgpack ./...','终端'),
 S('再补手工验收','<p>启动真实服务后检查 /healthz、注册、登录、无凭证访问与完整 CRUD。Ctrl+C 后重启，确认持久化与 token 仍按密钥/有效期工作。下载测试不替代真实网络、代理、TLS 或目标数据库部署验收。</p>'),
 S('明确未实现能力','<p>项目不包含 refresh token/撤销、登录限流、角色管理、上传路由、Redis、生产迁移、OpenTelemetry 或前端 CORS 集成。相关章节提供设计与练习。不要将目录里存在 Dockerfile 当成镜像已经构建或上线成功。</p>')
 ],'新增两个用例：空 PATCH 拒绝；不同 issuer 的签名正确 token 拒绝。','空 PATCH：创建任务后 PATCH {}，检查 400 和状态不变。issuer：使用 testSecret 签发 iss=other、aud 正确且未过期的 JWT，请求受保护路由应为 401。',Q('Dockerfile 存在是否证明部署已经成功？',['是','否，需要实际构建与运行验证','go test 会自动部署'],1,'不同验证覆盖不同风险，不能互相替代。'),'检查“拒绝后没有副作用”，不能只看状态码。'),
 L('deploy','构建、容器与优雅交付',50,'交付需要二进制、配置、持久化、运行权限和生命周期策略。先本地构建，再在目标环境逐项验收，不把教学默认值直接暴露到公网。',[
 S('构建与服务超时','<p>项目 http.Server 设置请求头、读写和空闲超时，收到信号后给在途请求最多 5 秒完成，再关闭底层数据库。Windows 输出名使用 .exe；保留依赖锁定文件与一致的构建标记。</p>','go fmt ./...\ngo vet -tags=nomsgpack ./...\ngo test -tags=nomsgpack ./...\ngo build -tags=nomsgpack -trimpath -o gin-quest.exe .','Windows 终端'),
 S('容器持久化与非 root 运行','<p>源码带多阶段 Dockerfile，运行用户 UID 10001，SQLite 写入 /data。使用持久卷，避免容器删除带走数据库。初次命名卷会继承镜像目录权限；已有卷与 bind mount 需要检查可写性。镜像只是课程构建示例，发布前审查基础镜像、依赖和补丁。</p>','docker build -t gin-quest:local .\ndocker volume create gin-quest-data\ndocker run --rm --env JWT_SECRET --mount source=gin-quest-data,target=/data gin-quest:local -migrate\ndocker run --rm --env JWT_SECRET -p 127.0.0.1:8080:8080 --mount source=gin-quest-data,target=/data gin-quest:local','终端（已配置 JWT_SECRET 且 Docker 可用）'),
 S('公网交付还需要什么','<p>配置 HTTPS 与可信代理，补登录限流/防爆破、认证生命周期、权限回归、生产迁移、备份恢复、监控告警和回滚。SQLite 备份需停写或使用一致性备份机制。滚动更新时检查 schema 兼容；多副本部署不应简单共享一个本地文件路径。</p>')
 ],'不接公网，构建并运行本地二进制，改变 ADDR 验证端口配置，Ctrl+C 后确认停止。','PowerShell：$env:ADDR="127.0.0.1:9090"；运行 .\\gin-quest.exe；访问 /healthz；Ctrl+C。数据库与密钥继续使用原值；命令窗口退出后检查没有残留占用。',Q('容器内部文件是否会自动永久保留？',['会','不会，要正确设计持久化卷与备份','只要 EXPOSE 就会'],1,'容器生命周期与业务数据生命周期不同。'),'发布前补齐认证入口防护；课程源码默认只用于本机学习。','https://gin-gonic.com/en/docs/deployment/'),
 L('graduate','进阶挑战与精通路线',40,'“精通”没有一个完成打卡就自动达成的时刻。你需要能解释设计、排查失败、保护数据并交付可验证的变更。用毕业挑战把这些能力落实到作品。',[
 S('挑战一：从教学版到可协作项目','<p>把 handler/service/repository 按真实职责拆分，保持接口契约不变；增加乐观锁，避免多人编辑覆盖；建立 schema 版本化迁移。每次只完成一项，先写验收，再实现。</p>'),
 S('挑战二：生产数据层与会话','<p>迁移 PostgreSQL 并建立独立集成测试；增加随机 refresh token、轮换与撤销；添加管理员能力时区分角色权限与资源归属权限。把跨用户和跨角色用例纳入 CI，不能只测管理员成功路径。</p>'),
 S('挑战三：观测与可靠交付','<p>配置受保护的 metrics/pprof，建立错误率和延迟指标；在隔离环境测量吞吐和资源预算；演练数据库备份恢复与 schema 兼容回滚。写出 README，让另一个人在不了解你电脑的情况下也能运行项目。</p>'),
 S('如何让 AI 帮你学习','<p>先独立画出请求链路，再让 AI 检查遗漏。提出具体输入与预期结果，要求给可复现案例、最小修改和验证命令。阅读并运行生成代码，确认权限与错误处理没有被“为了跑通”而绕开。</p>','请审查这段 Gin 代码：\n1. 解释请求流经的中间件、handler 与数据库。\n2. 检查认证、数据归属、输入校验和资源释放。\n3. 用具体请求证明问题，并给最小修复。\n4. 给测试与验证命令，明确哪些尚未执行。\n5. 不要为了通过测试而删除权限检查。','学习提示词')

 if(event.target.closest('[data-step]')){updateLab();return;}
 if(event.target.closest('[data-reset-lab]')){state.labStep=0;$$('[data-step-index]').forEach(item=>item.classList.remove('current'));$('#middleware-output').textContent='已重置，点击“下一步”。';$('[data-step]').disabled=false;return;}
 if(event.target.closest('[data-send-request]')){const identity=$('#lab-identity').value;const method=$('#lab-method').value;const status=identity==='anonymous'?401:identity==='other'?404:method==='DELETE'?204:200;$('#ownership-output').textContent=`${method} /api/v1/notes/42\n模拟身份：${identity==='owner'?'A（所有者）':identity==='other'?'B（其他用户）':'未登录'}\n→ ${status}\n${identity==='anonymous'?'认证失败，未执行数据操作。':identity==='other'?'归属不匹配，对外按不可见资源处理，任务未改变。':method==='DELETE'?'模拟授权成功，204 无响应正文。每次模拟均从初始任务开始。':'模拟授权成功，仅处理当前用户的任务。'}`;return;}
 if(event.target.closest('#complete')){const done=state.completed.includes(state.active);state.completed=done?state.completed.filter(id=>id!==state.active):[...state.completed,state.active];const saved=save('gin-quest:completed',state.completed);nav();$('#complete').textContent=done?'✓ 我学会了，标记完成':'✓ 已完成 · 撤销标记';toast(saved?'学习进度已保存。':'存储受限，本次进度可能无法在关闭后保留。');return;}
 if(event.target.closest('#print')){$$('details').forEach(item=>{item.dataset.previousOpen=String(item.open);item.open=true;});window.print();}
});
document.addEventListener('input',event=>{if(event.target===$('#notebook')){state.notes={...state.notes,[state.active]:event.target.value};const ok=save('gin-quest:notes',state.notes);$('#note-hint').textContent=ok?'笔记已自动保存在当前浏览器，请勿记录密码或 token。':'浏览器存储受限，请复制笔记到安全位置。';}});
window.addEventListener('afterprint',()=>$$('details[data-previous-open]').forEach(item=>{item.open=item.dataset.previousOpen==='true';delete item.dataset.previousOpen;}));
$('#open-search').addEventListener('click',openSearch);$('#close-search').addEventListener('click',()=>$('#search-dialog').close());$('#search-input').addEventListener('input',search);
$('#search-dialog').addEventListener('click',event=>{if(event.target!==$('#search-dialog'))return;const r=$('#search-dialog').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)$('#search-dialog').close();});
$('#theme-button').addEventListener('click',()=>{const theme=document.documentElement.style.colorScheme==='dark'?'light':'dark';document.documentElement.style.colorScheme=theme;save('gin-quest:theme',theme);themeLabel();});
$('#menu-button').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#backdrop').classList.toggle('open',open);$('#menu-button').setAttribute('aria-expanded',String(open));syncSidebar();});$('#backdrop').addEventListener('click',closeMenu);mobile.addEventListener('change',syncSidebar);
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('#search-dialog').open)openSearch();}if(event.key==='Escape')closeMenu();});window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
