ottom:2px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue)}.form-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.section-title{font-size:14px;font-weight:600;margin:0 0 16px}.target-box{border:1px dashed #c8d2eb;border-radius:7px;background:#fafbff;padding:22px;display:flex;align-items:center;justify-content:space-between}.hint{background:#f2f6ff;color:#6982b4;padding:11px 14px;border-radius:6px;font-size:12px;margin:14px 0}.summary-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.summary-row span:first-child{color:var(--muted)}.steps{display:flex;gap:0;align-items:center;padding:18px 0 25px}.step{display:flex;align-items:center;gap:8px;font-size:12px;color:#7c89a0;flex:1}.step:after{content:'';height:1px;background:#dfe6f6;flex:1;margin:0 14px}.step:last-child:after{display:none}.step b{background:#edf1ff;color:var(--blue);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px}.terminal{background:#172132;color:#b9c8dc;border-radius:6px;padding:20px;font:12px/2 Consolas,monospace;white-space:pre-wrap;min-height:250px}.terminal em{color:#65d7b1;font-style:normal}.graph{background-color:#fafcff;background-image:radial-gradient(#d7deeb 1px,transparent 1px);background-size:18px 18px;padding:35px 20px;display:flex;flex-direction:column;align-items:center;min-height:460px}.node{width:245px;background:white;border:1px solid #dae2f2;box-shadow:0 4px 12px #25345508;border-radius:8px;padding:14px 18px;text-align:left;position:relative}.node.selected{border-color:var(--blue);box-shadow:0 0 0 3px #4265ef12}.node small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.connector{color:#b9c6dc;line-height:28px}.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.resource-tile{background:white;border:1px solid var(--line);border-radius:8px;padding:23px}.resource-tile h3{font-size:15px;margin:12px 0 5px}.resource-tile p{font-size:12px;color:var(--muted);min-height:35px}.big-icon{font-size:22px;color:var(--blue);background:#f0f3ff;border-radius:8px;display:inline-block;padding:4px 12px}.overlay{position:fixed;inset:0;background:#18274055;z-index:40;display:flex;justify-content:flex-end;backdrop-filter:blur(2px)}.drawer{background:white;width:540px;max-width:95vw;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px #17294c15}.drawer.wide{width:1100px}.drawer-head{padding:23px 25px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-head h2{margin:0;font-size:19px}.drawer-body{padding:24px;overflow:auto;flex:1}.drawer-foot{border-top:1px solid var(--line);padding:17px 24px;display:flex;justify-content:flex-end;gap:10px;background:white}.picker-grid{display:grid;grid-template-columns:170px minmax(0,1fr) 185px;gap:15px}.picked{padding:9px;border:1px solid var(--line);border-radius:5px;margin:8px 0;font-size:11px}.picked button{float:right}.empty{text-align:center;padding:50px;color:var(--muted)}.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:100;background:#fff;border:1px solid #cceadd;box-shadow:0 8px 40px #17294025;border-radius:8px;padding:12px 25px;color:#248264}.metric-bar{height:5px;background:#edf1fa;border-radius:5px;margin-top:8px;overflow:hidden}.metric-bar span{height:100%;display:block;background:var(--blue)}.footer-note{text-align:center;color:#a1aaba;font-size:11px;margin-top:20px}.switch{border:0;border-radius:12px;padding:1px 10px;background:#dbe2ec;color:white}.switch.on{background:var(--blue)}.audit-diff{background:#effaf4;color:#328766;padding:12px;font:12px/1.8 Consolas,monospace;border-radius:6px}.mobile-menu{display:none}.close{border:0;background:none;color:var(--muted);font-size:22px}.badge{border:1px solid var(--line);padding:3px 8px;border-radius:4px;font-size:1 @media(min-width:1500px){main{padding:30px 40px}.stats{gap:22px}td{padding:18px}}

<body>
<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">◈</div> 运维工作台</div><div class="side-scroll" id="nav"></div><div class="side-foot">设计预览 · V1.0<br>所有操作仅使用本地演示数据</div></aside>
<div class="workspace"><header><div class="toolbar"><button class="btn mobile-menu" data-action="menu">☰</button><div class="crumb" id="crumb"></div></div><div class="profile"><span class="demo">交互原型 / 不连接真实资产</span><span>简体中文</span><span class="avatar">林</span><span>平台管理员</span></div></header><div class="tabstrip"><span>⌂ 工作台</span><span id="current-tab"></span></div><main id="main"></main></div><div id="modal"></div><div id="toast" aria-live="polite"></div>
<script>
'use strict';
const groups=[['概览',[['overview','⌂','工作台']]],['资产管理',[['hosts','▤','主机资产'],['groups','▦','分组与标签'],['tree','⋈','业务与服务树'],['credentials','♧','凭据引用'],['sources','⇄','资产源与同步']]],['作业系统',[['job','▷','执行作业'],['job-history','◷','作业历史']]],['任务系统',[['templates','▧','流程模板'],['designer','◇','流程设计'],['task','⊕','创建任务'],['schedules','◴','定时计划'],['task-history','≡','任务运行']]],['自动化资源',[['resources','▱','资源中心']]],['执行基础设施',[['pools','▥','Worker 池'],['runners','◎','Runner 实例'],['gateways','⇥','连接网关']]],['审计中心',[['audit','⊙','操作审计']]]];
const hosts=[
{id:1,name:'prod-web-01',ip:'192.0.2.11',os:'Linux',env:'生产环境',group:'电商平台 / Web 服务',tag:'web',status:'可用',credential:'SSH · deploy-key',cpu:'4 核 / 8 GB'},
{id:2,name:'prod-web-02',ip:'192.0.2.12',os:'Linux',env:'生产环境',group:'电商平台 / Web 服务',tag:'web',status:'可用',credential:'SSH · deploy-key',cpu:'4 核 / 8 GB'},
{id:3,name:'prod-api-01',ip:'192.0.2.21',os:'Linux',env:'生产环境',group:'电商平台 / API 服务',tag:'api',status:'可用',credential:'SSH · deploy-key',cpu:'8 核 / 16 GB'},
{id:4,name:'stage-web-01',ip:'198.51.100.11',os:'Linux',env:'预发环境',group:'电商平台 / Web 服务',tag:'web',status:'可用',credential:'SSH · stage-key',cpu:'2 核 / 4 GB'},
{id:5,name:'test-win-01',ip:'198.51.100.31',os:'Windows',env:'测试环境',group:'内部系统 / 办公服务',tag:'windows',status:'可用',credential:'WinRM · win-admin',cpu:'4 核 / 8 GB'},
{id:6,name:'stage-api-02',ip:'198.51.100.22',os:'Linux',env:'预发环境',group:'电商平台 / API 服务',tag:'api',status:'待完善',credential:'未配置',cpu:'4 核 / 8 GB'}];
const state={page:'hosts',selected:new Set(),draft:new Set(),query:'',env:'全部环境',tree:'全部主机',pickerQuery:'',pickerEnv:'全部环境',pickerTree:'全部主机',jobType:'快速命令',name:'Web 服务健康检查',command:'uptime\ndf -h\nfree -m',pool:'通用执行池',strategy:'固定主机',node:1,runs:[],scheduleOn:true,resourceTab:'命令',resourceQuery:'',detailTab:'主机结果',lastRun:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(text,action,cls='',extra='')=>`<button class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`;
const pill=(text,color='blue')=>`<span class="pill ${color}"><span class="dot"></span>${esc(text)}</span>`;
const pageMeta=()=>groups.flatMap(([group,items])=>items.map(([id,icon,title])=>({id,icon,title,group}))).find(x=>x.id===state.page)||{title:'运行详情',group:'执行记录'};
const selectedHosts=()=>hosts.filter(h=>state.selected.has(h.id));
const stats=items=>`<div class="stats">${items.map(([label,note,desc,icon])=>`<div class="stat"><span class="icon">${icon||'◈'}</span><div class="label">${label}</div><div class="number">${note}</div><div class="trend">${desc}</div></div>`).join('')}</div>`;
const heading=(title,sub,actions='')=>`<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="toolbar">${actions}</div></div>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(cells=>`<tr>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="empty">没有匹配的数据，请调整筛选条件</td></tr>`}</tbody></table></div>`;
const pagination=n=>`<div class="pagination">共 ${n} 条 <span class="badge">10 条 / 页</span><span>‹</span><span class="page-num">1</span><span>›</span></div>`;
const field=(label,input,hint='')=>`<div class="field"><label>${label}</label>${input}${hint?`<small>${hint}</small>`:''}</div>`;
const select=(id,items,value)=>`<select id="${id}">${items.map(x=>`<option ${value===x?'selected':''}>${x}</option>`).join('')}</select>`;
function nav(){document.getElementById('nav').innerHTML=groups.map(([label,items])=>`<div class="group-title">${label}</div>${items.map(([id,icon,title])=>`<button class="nav ${state.page===id?'active':''}" data-page="${id}"><i>${icon}</i>${title}</button>`).join('')}`).join('');}
function go(page){state.page=page;state.query='';state.env='全部环境';state.tree='全部主机';closeModal();render();document.getElementById('sidebar').classList.remove('open');window.scrollTo(0,0);}
function treeHtml(picker=false){const current=picker?state.pickerTree:state.tree;return `<div class="card tree"><h4>业务 / 服务树</h4>${['全部主机','电商平台','Web 服务','API 服务','内部系统','办公服务'].map((x,i)=>`<button class="${current===x?'active':''} ${[2,3,5].includes(i)?'indent':''}" data-tree="${x}" ${picker?'data-picker="1"':''}>${[0,1,4].includes(i)?'▾':'·'} ${x}</button>`).join('')}<h4 style="margin-top:24px">常用标签</h4><div class="toolbar" style="padding:0 10px">${['web','api','windows'].map(x=>`<button class="pill" data-tree="${x}" ${picker?'data-picker="1"':''}>${x}</button>`).join('')}</div></div>`;}
const filterHosts=(query,env,tree)=>hosts.filter(h=>(h.name+' '+h.ip).toLowerCase().includes(query.toLowerCase())&&(env==='全部环境'||h.env===env)&&(tree==='全部主机'||h.group.includes(tree)||h.tag===tree));
function hostTable(rows,picker=false){const chosen=picker?state.draft:state.selected;return table([`<input aria-label="选择当前结果" type="checkbox" data-all="${picker?'picker':'hosts'}" ${rows.length&&rows.every(h=>chosen.has(h.id))?'checked':''}>`,'主机名称 / IP','环境','系统 / 配置','连接凭据','状态',...(picker?[]:['操作'])],rows.map(h=>[`<input aria-label="选择 ${h.name}" type="checkbox" data-host="${h.id}" ${picker?'data-picker="1"':''} ${chosen.has(h.id)?'checked':''}>`,`<b>${h.name}</b><small>${h.ip}</small>`,pill(h.env,h.env==='生产环境'?'blue':'orange'),`${h.os}<small>${h.cpu}</small>`,h.credential,pill(h.status,h.status==='可用'?'green':'orange'),...(picker?[]:[`<button class="link" data-host-detail="${h.id}">详情</button>`]) ]));}
function hostPage(){const rows=filterHosts(state.query,state.env,state.tree);return heading('主机资产','统一维护执行目标，作业与任务共享同一份资产数据',button('＋ 新增主机','add-host','primary'))+stats([['主机总数','6','覆盖 3 个环境','▤'],['可用主机','5','资产连接信息已配置','✓'],['待完善','1','需要关联连接凭据','!'],['业务分组','2','电商平台 · 内部系统','⋈']])+`<div class="card filters">${field('主机名称 / IP',`<input id="host-query" placeholder="搜索主机名称或 IP" value="${esc(state.query)}">`)}${field('环境',select('host-env',['全部环境','生产环境','预发环境','测试环境'],state.env))}<div class="toolbar">${button('查询','search-host','primary')}${button('重置','reset-host')}</div></div><div class="split">${treeHtml()}<div class="card"><div class="card-head"><strong>主机列表 <span class="badge">${rows.length}</span></strong><div class="toolbar">${button('▷ 执行作业','from-host-job','soft',state.selected.size?'':'disabled')}${button('创建任务','from-host-task','',state.selected.size?'':'disabled')}${button('↻','refresh')}</div></div><div class="selection">已选择 ${state.selected.size} 台主机，跨筛选保留选择<button class="link" data-action="clear-hosts">清空选择</button></div>${hostTable(rows)}${pagination(rows.length)}</div></div>`;}
function picker(){state.draft=new Set(state.selected);state.pickerQuery='';state.pickerEnv='全部环境';state.pickerTree='全部主机';showPicker();}
function showPicker(){const rows=filterHosts(state.pickerQuery,state.pickerEnv,state.pickerTree);openModal('选择执行目标',`<div class="hint" style="margin-top:0">选择资产作为本次执行目标。提交后生成独立快照，不受后续资产变更影响。</div><div class="filters" style="padding:0 0 20px">${field('搜索主机',`<input id="picker-query" value="${esc(state.pickerQuery)}" placeholder="主机名称 / IP">`)}${field('环境',select('picker-env',['全部环境','生产环境','预发环境','测试环境'],state.pickerEnv))}${button('查询','search-picker','primary')}</div><div class="picker-grid">${treeHtml(true)}<div>${hostTable(rows,true)}</div><div><b>已选主机（${state.draft.size}）</b>${hosts.filter(h=>state.draft.has(h.id)).map(h=>`<div class="picked"><button class="link" data-remove="${h.id}">×</button>${h.name}<div class="sub">${h.ip}</div></div>`).join('')||'<div class="empty">尚未选择</div>'}</div></div>`,button('取消','close')+button(`确认选择 ${state.draft.size} 台`,'confirm-targets','primary'),'wide');}

function preview(){saveForm();const chosen=selectedHosts();if(!state.name.trim())return toast('请填写运行名称');if(!chosen.length)return toast('请先选择至少一台主机');if(chosen.some(h=>h.status!=='可用'))return toast('请移除未配置凭据的主机');if(state.page==='job'&&state.jobType==='快速命令'&&new Set(chosen.map(h=>h.os)).size>1)return toast('快速命令请按 Linux / Windows 分开执行');if(state.page==='job'&&state.jobType==='文件分发'&&!document.getElementById('upload')?.files.length)return toast('请选择要分发的演示文件');if(state.page==='job'&&state.jobType==='快速命令'&&!state.command.trim())return toast('请填写命令内容');if(Number(document.getElementById('timeout')?.value)<=0||Number(document.getElementById('forks')?.value)<=0)return toast('超时和并发数必须大于 0');openModal('确认执行',`<div class="hint">这是本地交互演示。确认后仅生成一条模拟运行记录。</div><h3>${esc(state.name)}</h3><div class="summary-row"><span>执行域</span><span>${state.page==='task'?'任务系统':'作业系统'}</span></div><div class="summary-row"><span>Worker 池</span><span>${esc(state.pool)}</span></div><h4>目标快照 · ${chosen.length} 台主机</h4>${table(['主机','地址','环境'],chosen.map(h=>[h.name,h.ip,pill(h.env)]))}<label style="display:block;margin-top:20px"><input type="checkbox" id="confirm-risk"> 我已确认执行内容与目标范围</label>`,button('返回修改','close')+button('确认模拟执行','submit-run','primary'));}
function saveForm(){const name=document.getElementById('run-name'),cmd=document.getElementById('command'),pool=document.getElementById('pool');if(name)state.name=name.value;if(cmd)state.command=cmd.value;if(pool)state.pool=pool.value;}
function submitRun(){if(!document.getElementById('confirm-risk')?.checked)return toast('请勾选目标范围确认');const run={id:1048+state.runs.length,name:state.name,domain:state.page==='task'?'任务':'作业',targets:selectedHosts().map(h=>({...h})),pool:state.pool,time:new Date().toLocaleTimeString('zh-CN'),status:'成功'};state.runs=[run,...state.runs];state.lastRun=run;state.detailTab='主机结果';go('detail');toast('模拟执行完成，已生成运行与审计记录');}

const resourceData={'命令':[['系统健康检查','Linux Shell','v2'],['服务探活','Linux Shell','v1']],'脚本':[['磁盘清理','Shell','v1'],['Windows 巡检','PowerShell','v2']],'Playbook':[['Nginx 滚动部署','Ansible Playbook','v3']],'模块':[['主机连通性','ansible.builtin.ping','v1']],'API':[['发布结果回调','HTTPS · POST','v1']],'Jenkins':[['应用构建流水线','Jenkins Job','v4']],'通知':[['发布通知','企业消息','v1']]};
function resourcesPage(){const rows=resourceData[state.resourceTab].filter(r=>r.join(' ').includes(state.resourceQuery));return heading('自动化资源','统一维护执行内容与发布版本，供作业和流程复用',button('＋ 新建资源','add-resource','primary'))+`<div class="card"><div class="tabs">${Object.keys(resourceData).map(t=>`<button class="${state.resourceTab===t?'active':''}" data-resource-tab="${t}">${t}</button>`).join('')}</div><div class="filters">${field('资源名称',`<input id="resource-query" value="${esc(state.resourceQuery)}" placeholder="搜索资源">`)}${button('查询','search-resource','primary')}</div>${table(['资源名称','类型','当前版本','状态','维护人','操作'],rows.map(r=>[...r,pill('已发布','green'),'平台运维组',`<button class="link" data-resource-detail="${esc(r[0])}">详情 / 版本</button><button class="link" data-action="use-resource">用于执行</button>`]))}${pagination(rows.length)}</div><div class="hint">资源定义不绑定固定主机。执行时由作业、任务或流程节点关联资产目标。</div>`;}
function auditPage(){const rows=[...state.runs.map(r=>[r.time,'林管理员','创建运行',r.name,'成功',String(r.id)]),['10:22:41','林管理员','修改资产','prod-web-01','成功','host-1'],['09:52:03','张运维','发布流程','Web 应用发布 v3','成功','flow-3'],['09:40:26','王开发','执行作业','API 连通性检查','失败','1045']].filter(r=>r.join(' ').includes(state.query));return heading('操作审计','谁在什么时间，对什么对象进行了什么操作',button('导出演示记录','export-audit'))+`<div class="card filters">${field('操作人 / 操作 / 对象',`<input id="audit-query" value="${esc(state.query)}" placeholder="搜索审计记录">`)}${button('查询','search-audit','primary')}</div><div class="card">${table(['时间','操作人','操作','对象','结果','操作'],rows.map(r=>[...r.slice(0,4),pill(r[4],r[4]==='成功'?'green':'red'),`<button class="link" data-audit="${esc(r[5])}">查看详情</button>`]))}${pagination(rows.length)}</div><div class="hint">审计只读。此处不提供新增、编辑或删除操作；执行 stdout 在运行详情中查看。</div>`;}
function overview(){return heading('工作台','你好，林管理员。查看资产概况与最近执行情况。',`<button class="btn primary" data-page="job">▷ 执行作业</button>`)+stats([['资产总量','6','5 台可用 · 1 台待完善','▤'],['今日运行',3+state.runs.length,'作业与任务统一追溯','▷'],['执行实例','2 / 3','在线 / 总数','◎'],['已发布流程','2','支持手动与定时触发','◇']])+`<div class="resource-grid">${[['hosts','▤','选择资产','从业务与分组定位主机，批量发起操作'],['job','▷','执行作业','快速命令、脚本、Playbook 与文件分发'],['task','◇','创建任务','使用已发布流程完成标准化交付']].map(([p,i,t,d])=>`<div class="resource-tile"><div class="big-icon">${i}</div><h3>${t}</h3><p>${d}</p><button class="btn soft" data-page="${p}">进入 →</button></div>`).join('')}</div><div class="card" style="margin-top:20px"><div class="card-head"><strong>最近执行</strong><button class="link" data-page="job-history">全部作业 →</button></div>${table(['运行名称','领域','状态','目标数量','操作'],[...state.runs,...baseRuns()].slice(0,5).map(r=>[r.name,r.domain,pill(r.status,r.status==='成功'?'green':'red'),r.targets.length,`<button class="link" data-run="${r.id}">查看</button>`]))}</div>`;}
function render(){nav();const meta=pageMeta();document.getElementById('crumb').innerHTML=`工作台　 /　 ${meta.group}　 /　 <b>${meta.title}</b>`;document.getElementById('current-tab').textContent=meta.title;const pages={overview,hosts:hostPage,job:()=>executionPage(false),task:()=>executionPage(true),'job-history':historyPage,'task-history':historyPage,detail:detailPage,templates:templatesPage,designer:designerPage,schedules:schedulesPage,resources:resourcesPage,audit:auditPage};document.getElementById('main').innerHTML=(pages[state.page]||catalogPage)()+`<div class="footer-note">运维平台交互原型 · 参考 soybean-admin 管理页规范 · 演示数据仅保留在当前页面</div>`;}
function openModal(title,body,footer='',size=''){document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><h2>${title}</h2><button class="close" aria-label="关闭" data-action="close">×</button></div><div class="drawer-body">${body}</div><div class="drawer-foot">${footer||button('关闭','close')}</div></section></div>`;document.body.style.overflow='hidden';document.querySelector('.drawer button')?.focus();}
function closeModal(){document.getElementById('modal').innerHTML='';document.body.style.overflow='';}
let toastTimer;function toast(message){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3200);}
function hostDetail(id){const h=hosts.find(x=>x.id===id);openModal('主机资产详情',`<h3>${h.name}</h3>${[['IP 地址',h.ip],['系统',h.os],['环境',h.env],['业务归属',h.group],['资源配置',h.cpu],['凭据引用',h.credential],['状态',h.status]].map(([a,b])=>`<div class="summary-row"><span>${a}</span><b>${b}</b></div>`).join('')}<div class="hint">从这里发起执行，将自动带入当前主机。</div>`,button('关闭','close')+button('执行作业','single-job','primary',`data-id="${id}"`));}
function genericEditor(title,kind='resource',row=[]){const fields=kind==='credential'?field('认证方式',select('editor-type',['SSH 密钥','SSH 密码','WinRM 密码'],'SSH 密钥'))+'<br>'+field('凭据引用','<input placeholder="输入密钥托管引用，如 vault://team/key">')+'<div class="hint">原型无需填写真实密码或私钥。</div>':kind==='schedule'?field('执行周期',select('editor-cycle',['每天 09:00','每小时','每周一 09:00'],'每天 09:00'))+'<br>'+field('目标策略',select('editor-target',['固定主机','动态规则'],'动态规则'))+'<br>'+field('目标范围',select('editor-range',['生产环境 + web 标签','预发环境 + api 标签'],'生产环境 + web 标签')):field('说明','<textarea id="editor-description" placeholder="请输入说明"></textarea>');openModal(title,field('名称 *',`<input id="editor-name" value="${esc(row[0]||'')}" placeholder="请输入名称">`)+`<br>${fields}<div class="hint">用于评审表单与抽屉布局；保存只在本次预览中显示反馈。</div>`,button('取消','close')+button('保存演示配置','save-editor','primary'));}
function download(name,content,type='text/plain'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const actions={menu:()=>document.getElementById('sidebar').classList.toggle('open'),close:closeModal,refresh:()=>{render();toast('演示数据已刷新');},'search-host':()=>{state.query=document.getElementById('host-query').value;state.env=document.getElementById('host-env').value;render();},'reset-host':()=>{state.query='';state.env='全部环境';state.tree='全部主机';render();},'clear-hosts':()=>{state.selected=new Set();render();},'from-host-job':()=>go('job'),'from-host-task':()=>go('task'),picker:()=>{saveForm();picker();},'search-picker':()=>{state.pickerQuery=document.getElementById('picker-query').value;state.pickerEnv=document.getElementById('picker-env').value;showPicker();},'confirm-targets':()=>{state.selected=new Set(state.draft);closeModal();render();},preview,'submit-run':submitRun,'single-job':el=>{state.selected=new Set([Number(el.dataset.id)]);go('job');},'search-history':()=>{state.query=document.getElementById('history-query').value;render();},'download-log':()=>{const r=state.lastRun||baseRuns()[0];download(`demo-run-${r.id}.log`,`DEMO ONLY\nRun #${r.id}: ${r.name}\nTargets: ${r.targets.map(h=>h.name).join(', ')}\nStatus: ${r.status}\n`);},'save-flow':()=>toast('演示草稿已保存，已发布版本保持不变'),'publish-flow':()=>openModal('发布流程版本','<div class="hint">演示校验通过：4 个节点、3 条连线，资源版本完整。</div><h3>Web 应用发布 · v4</h3><p>发布后此版本不可修改，新建任务可引用此版本。</p>',button('取消','close')+button('确认演示发布','confirm-publish','primary')),'confirm-publish':()=>{closeModal();toast('演示版本 v4 已发布');},'save-node':()=>toast('节点配置已保存（演示）'),'node-picker':()=>picker(),'add-schedule':()=>genericEditor('定时计划','schedule',['每日服务巡检']),'toggle-schedule':()=>{state.scheduleOn=!state.scheduleOn;render();toast(state.scheduleOn?'演示计划已启用':'演示计划已暂停');},'catalog-add':()=>state.page==='runners'?(render(),toast('实例状态已刷新')):genericEditor(`新增${catalogs[state.page].title}`,state.page==='credentials'?'credential':'resource'),'search-catalog':()=>{state.query=document.getElementById('catalog-query').value;render();},'reset-catalog':()=>{state.query='';render();},sync:()=>toast('演示同步完成：新增 0 台，更新 2 台，无外部请求'),'add-resource':()=>genericEditor(`新建${state.resourceTab}资源`),'search-resource':()=>{state.resourceQuery=document.getElementById('resource-query').value;render();},'use-resource':()=>{state.jobType=['脚本','Playbook','模块'].includes(state.resourceTab)?state.resourceTab:'快速命令';go('job');},'search-audit':()=>{state.query=document.getElementById('audit-query').value;render();},'export-audit':()=>download('demo-audit.csv','\uFEFF时间,操作人,操作,对象,结果\n10:22:41,林管理员,修改资产,prod-web-01,成功\n','text/csv'),'add-host':()=>openModal('新增主机',field('主机名称 *','<input id="editor-name" placeholder="例如 stage-web-02">')+'<br>'+field('IP 地址 *','<input placeholder="192.0.2.100">')+'<br>'+field('操作系统',select('editor-os',['Linux','Windows'],'Linux'))+'<br>'+field('环境',select('editor-env',['测试环境','预发环境','生产环境'],'测试环境'))+'<br>'+field('凭据引用',select('editor-cred',['stage-key','deploy-key','win-admin'],'stage-key'))+'<div class="hint">演示表单，不写入真实资产库。</div>',button('取消','close')+button('保存演示配置','save-editor','primary')),'save-editor':()=>{if(!document.getElementById('editor-name')?.value.trim())return toast('名称不能为空');closeModal();toast('配置校验通过（仅演示，不写入数据库）');}};
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.page)return go(el.dataset.page);if(el.dataset.action)return actions[el.dataset.action]?.(el);if(el.dataset.tree){if(el.dataset.picker){state.pickerTree=el.dataset.tree;showPicker();}else{state.tree=el.dataset.tree;render();}return;}if(el.dataset.remove){state.draft.delete(Number(el.dataset.remove));return showPicker();}if(el.dataset.hostDetail)return hostDetail(Number(el.dataset.hostDetail));if(el.dataset.jobType){saveForm();state.jobType=el.dataset.jobType;return render();}if(el.dataset.node){state.node=Number(el.dataset.node);return render();}if(el.dataset.run){state.lastRun=[...state.runs,...baseRuns()].find(r=>r.id===Number(el.dataset.run));state.detailTab='主机结果';return go('detail');}if(el.dataset.detailTab){state.detailTab=el.dataset.detailTab;return render();}if(el.dataset.resourceTab){state.resourceTab=el.dataset.resourceTab;state.resourceQuery='';return render();}if(el.dataset.resourceDetail)return openModal('资源版本详情',`<h3>${esc(el.dataset.resourceDetail)}</h3><div class="hint">已发布版本只读。修改需创建新草稿版本。</div>${table(['版本','状态','发布人'],[['v2',pill('已发布','green'),'林管理员'],['v1',pill('已归档'),'张运维']])}`,button('关闭','close')+button('创建新草稿','add-resource','primary'));if(el.dataset.catalogDetail!==undefined){const c=catalogs[state.page];const row=c.rows[Number(el.dataset.catalogDetail)];return state.page==='runners'?openModal('Runner 实例详情',`<h3>${row[0]}</h3><p>所属池：${row[1]}</p><p>心跳状态：${row[2]}</p><p>当前负载：${row[3]}</p><div class="metric-bar"><span style="width:20%"></span></div><div class="hint">实例由 Worker 注册，此页只展示状态。</div>`):genericEditor(`编辑${c.title}`,state.page==='credentials'?'credential':'resource',row);}if(el.dataset.audit)return openModal('审计详情',`<div class="summary-row"><span>操作人</span><b>林管理员</b></div><div class="summary-row"><span>关联对象</span><b>${esc(el.dataset.audit)}</b></div><div class="summary-row"><span>请求 ID</span><b>demo-request-20260910</b></div><h4>变更摘要</h4><div class="audit-diff">操作已记录<br>敏感字段：******<br>结果：成功</div><div class="hint">只读审计记录，用于追溯操作与运行。</div>`);});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.host){const chosen=el.dataset.picker?state.draft:state.selected;el.checked?chosen.add(Number(el.dataset.host)):chosen.delete(Number(el.dataset.host));return el.dataset.picker?showPicker():render();}if(el.dataset.all){const picker=el.dataset.all==='picker';const chosen=picker?state.draft:state.selected;const rows=picker?filterHosts(state.pickerQuery,state.pickerEnv,state.pickerTree):filterHosts(state.query,state.env,state.tree);rows.forEach(h=>el.checked?chosen.add(h.id):chosen.delete(h.id));return picker?showPicker():render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.querySelector('.drawer')){const elements=[...document.querySelectorAll('.drawer button,.drawer input,.drawer select,.drawer textarea')].filter(x=>!x.disabled);const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script>
</body></html>
