function paintModal(){const m=ui.modal;if(!m)return closeModal();document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer ${m.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${E(m.title)}"><div class="dialog-head"><h2>${m.title}</h2><button class="close" data-action="modal-back" aria-label="关闭弹窗">×</button></div><div class="dialog-body">${m.body}</div><div class="dialog-foot">${m.footer||B('关闭','modal-back')}</div></section></div>`;document.body.style.overflow='hidden';document.querySelector('.dialog-head button').focus();}
function backModal(){if(ui.history.length){ui.modal=ui.history.pop();paintModal();}else closeModal();}
let toastTimer;function toast(text){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${E(text)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2800);}
function nav(page){if(ui.page==='designer'&&ui.dirty){ui.pendingNavigation=page;return modal('有未保存的步骤修改','<p>离开后将丢弃尚未保存的步骤编辑。是否继续？</p>',B('继续编辑','modal-back')+B('放弃修改并离开','discard-navigation','','danger'));}if(ui.page==='create')captureCreate();ui.page=page;ui.query='';ui.status='全部';ui.pageNo=1;closeModal();render();window.scrollTo(0,0);document.getElementById('side').classList.remove('open');}
function render(){const title=ui.page==='designer'?'步骤编排':ui.page==='detail'?'运行详情':navs.flatMap(x=>x[1]).find(x=>x[0]===ui.page)?.[2];document.getElementById('nav').innerHTML=navs.map(([group,items])=>`<div class="section">${group}</div>${items.map(([p,i,n])=>`<button class="nav ${ui.page===p||(p==='templates'&&ui.page==='designer')?'active':''}" data-action="nav" data-arg="${p}"><i>${i}</i>${n}</button>`).join('')}`).join('')+`<div class="section">原型工具</div>${B('↻ 重置演示数据','reset-demo','','link')}`;document.getElementById('crumb').innerHTML=`工作台　 /　 任务中心　 /　 <b>${title}</b>`;document.getElementById('tab').textContent=title;const pages={overview:overviewPage,templates:templatesPage,designer:designerPage,create:createPage,schedules:schedulesPage,runs:runsPage,detail:detailPage,assets:assetsPage,resources:resourcesPage,audit:auditPage};document.getElementById('main').innerHTML=pages[ui.page]()+`<div class="notice">交互原型 · 所有数据及操作均为本地演示 · 无 BPMN、无真实资产连接</div>`;}
function overviewPage(){return head('任务概览','编排、发布、选择资产、执行与追溯，一个完整的任务闭环',B('＋ 创建任务','nav','create','primary'))+stats([['流程模板',templates.length,'统一管理定义和版本','▧'],['已发布版本',templates.flatMap(t=>t.versions).filter(v=>v.status==='已发布').length,'固定资源引用，可创建任务','◇'],['运行中任务',runs.filter(r=>r.status==='运行中').length,'可查看步骤进度或取消','▷'],['启用计划',schedules.filter(s=>s.enabled).length,'按固定版本创建运行','◴']])+`<div class="resource-cards">${[['templates','01','维护流程模板','创建草稿，引用自动化资源，配置顺序步骤。'],['create','02','选择资产并执行','固定流程版本，为每个目标参数选择主机。'],['runs','03','查看执行结果','按步骤检查日志、目标快照与失败原因。']].map(([p,i,n,d])=>`<div class="tile"><span class="glyph">${i}</span><h3>${n}</h3><p>${d}</p>${B('进入 →','nav',p,'soft')}</div>`).join('')}</div><div class="card" style="margin-top:20px"><div class="card-head"><b>最近任务</b>${L('全部任务 →','nav','runs')}</div>${runTable(runs.slice(0,5))}</div>`;}

function versions(tid){ui.templateId=tid;const t=tm(tid);modal(`${E(t.name)} · 版本管理`, `<div class="hint">已发布和归档版本只读。编辑发布版本请先复制为新草稿。</div>${T(['版本','状态','步骤数','说明','操作'],[...t.versions].sort((a,b)=>b.number-a.number).map(v=>['v'+v.number,P(v.status,v.status==='已发布'?'green':v.status==='草稿'?'orange':'gray'),v.steps.length,E(v.note),L(v.status==='草稿'?'编排':'查看步骤','edit-version',v.id)+L('复制草稿','clone-version',v.id)+(v.status==='草稿'?L('发布','version-publish',v.id):v.status==='已发布'?L('执行','version-execute',v.id)+L('归档','version-archive',v.id):'')]))}`,B('关闭','modal-back')+B('＋ 新建空白草稿','blank-version',tid,'primary'),true);}
function editVersion(vid){const v=vr(ui.templateId,vid);ui.versionId=vid;ui.editingSteps=clone(v.steps);ui.selectedStep=0;ui.dirty=false;nav('designer');}
function designerPage(){const t=tm(ui.templateId),v=currentVersion(),readonly=v.status!=='草稿';const steps=ui.editingSteps||v.steps;const s=steps[ui.selectedStep];return head(`${E(t.name)} · v${v.number}`,`流程模板 / ${v.status} · 顺序步骤编辑器，不使用 BPMN`,B('返回版本','designer-back')+B('校验','validate-flow')+(readonly?B('复制为新草稿','clone-version',v.id,'primary'):B('保存草稿','save-flow')+B('校验并发布','publish-editor','','primary')))+`<div class="hint ${readonly?'warn':''}">${readonly?'当前版本只读，执行引用不会因草稿修改而变化。':'编辑顺序就是执行顺序。步骤标识保持稳定；支持上下移动、复制和删除。'} ${ui.dirty?'　● 有未保存修改':''}</div><div class="steps-layout"><div class="card"><div class="card-head"><b>流程步骤 <span class="badge">${steps.length} 个</span></b>${B('＋ 添加步骤','add-step','','soft',readonly)}</div><div class="step-list"><div class="endpoint">●　开始</div>${steps.map((x,i)=>`<div class="step-row"><div class="step-num">${i+1}</div><div class="step-card ${ui.selectedStep===i?'active':''}"><button class="step-name" data-action="select-step" data-arg="${i}">${E(x.name)}<small>${E(res(x.resource)?.type)} · ${E(res(x.resource)?.name)} ${E(res(x.resource)?.version)}</small></button><div class="step-tools">${B('↑','move-step',`${i}:-1`,'',readonly||i===0)}${B('↓','move-step',`${i}:1`,'',readonly||i===steps.length-1)}${B('复制','copy-step',i,'',readonly)}${B('删除','delete-step',i,'',readonly)}</div></div></div><div class="connector">│</div>`).join('')||'<div class="empty">还没有步骤，点击添加步骤从自动化资源选择</div>'}<div class="endpoint">●　结束</div></div></div><div class="card"><div class="card-head"><b>${s?'步骤配置':'配置面板'}</b>${s?P(`步骤 ${ui.selectedStep+1}`):''}</div><div class="pad">${s?`<fieldset ${readonly?'disabled':''} style="border:0;padding:0;margin:0;min-width:0"><div class="stack">${field('步骤名称 *',inp('step-name',s.name))}${field('自动化资源 / 版本',`<div>${P(res(s.resource)?.type)}　${E(res(s.resource)?.name)} ${E(res(s.resource)?.version)}</div><div>${B('更换资源','replace-resource','','soft')}${B('查看内容','inspect-resource',s.resource)}</div>`)}${field('执行目标',res(s.resource)?.os==='无需主机'?'<div class="hint">此步骤不依赖主机资产</div>':options('step-target',['应用主机','数据库主机','办公主机'],s.target),'创建任务时为目标参数绑定主机')}${field('输入参数（JSON）',`<textarea id="step-params">${E(s.params)}</textarea>`,'可填写演示值，例如 {"service":"nginx"}')}${field('超时（秒）',inp('step-timeout',s.timeout,'number'))}${field('重试次数',inp('step-retries',s.retries,'number'))}${field('失败策略',options('step-failure',['失败终止','忽略失败'],s.failure))}${field('主机执行方式',options('step-mode',['并行执行','串行执行','滚动执行'],s.mode))}</div>${B('保存步骤配置','save-step','','primary')}</fieldset>${readonly?B('查看资源内容','inspect-resource',s.resource):''}<div class="sub" style="margin-top:15px">稳定标识：${E(s.id)}</div>`:'<div class="empty">添加步骤后在这里配置</div>'}</div></div></div>`;}
function resourcePicker(replace=false){ui.resourceReplace=replace;modal(replace?'更换步骤资源':'添加执行步骤',`<div class="hint">仅可选择已发布资源。选择后生成固定资源版本引用。</div>${T(['资源名称','类型','版本','目标系统','操作'],resources.filter(r=>r.status==='已发布').map(r=>[r.name,P(r.type),r.version,r.os,L('查看','inspect-resource',r.id)+B('选择','choose-resource',r.id,'soft')]))}`,B('取消','modal-back'),true);}
function validate(steps){const errors=[];if(!steps.length)errors.push('至少需要一个可执行步骤');steps.forEach((s,i)=>{if(!s.name.trim())errors.push(`步骤 ${i+1} 名称为空`);if(res(s.resource)?.status!=='已发布')errors.push(`步骤 ${i+1} 必须引用已发布资源`);if(s.timeout<1||s.retries<0)errors.push(`步骤 ${i+1} 超时或重试无效`);});return errors;}
function validateModal(steps){const errors=validate(steps);modal('流程校验结果',errors.length?`<div class="hint error">${errors.map(E).join('<br>')}</div>`:`<div class="hint">校验通过</div>${summary([['顺序步骤',steps.length],['资源版本','全部已发布'],['目标参数',slots(steps).join('、')||'无需主机'],['执行结构','线性顺序，无分支和循环']])}`);}
function publishDialog(vid){ui.versionId=vid;const v=currentVersion();const errors=validate(v.steps);if(errors.length)return validateModal(v.steps);modal('发布流程版本',`<h3>${E(tm(ui.templateId).name)} · v${v.number}</h3><div class="hint">发布后只读。已有发布版本继续可执行，定时计划仍固定引用原版本。</div>${summary([['步骤数',v.steps.length],['目标参数',slots(v.steps).join('、')||'无需主机'],['资源引用','固定已发布版本']])}${field('发布说明',`<textarea id="publish-note">${E(v.note||'完成流程配置，准备发布')}</textarea>`)}`,B('取消','modal-back')+B('确认发布','publish-confirm',vid,'primary'),false,true);}
function startCreate(tid,vid){const t=tm(tid);const v=vid?vr(tid,vid):t.versions.filter(v=>v.status==='已发布').sort((a,b)=>b.number-a.number)[0];if(!t.enabled||!v||v.status!=='已发布')return modal('暂时无法执行','<p>模板必须启用，并至少有一个已发布版本。请先完成步骤编排和发布。</p>',B('关闭','modal-back')+B('管理版本','versions',tid,'primary'));create.templateId=tid;create.versionId=v.id;create.name=t.name;create.bindings=Object.fromEntries(slots(v.steps).map(s=>[s,create.bindings[s]||[]]));nav('create');}
function captureCreate(){if(document.getElementById('run-name')){create.name=document.getElementById('run-name').value;create.params=document.getElementById('run-params').value;create.pool=document.getElementById('run-pool').value;create.timeout=Number(document.getElementById('run-timeout').value);}}
function createPage(){const t=tm(create.templateId),v=activeVersion();const selectedSlots=slots(v?.steps||[]);return head('创建任务','选择已发布流程版本，为目标参数关联资产并提交一次执行',B('查看任务列表','nav','runs'))+`<div class="split"><div><div class="card"><div class="card-head"><b>01　流程与参数</b>${P('手动执行')}</div><div class="pad"><div class="form-row">${field('流程模板',options('create-template',templates.filter(t=>t.enabled&&t.versions.some(v=>v.status==='已发布')).map(t=>[t.id,t.name]),create.templateId))}${field('固定版本',options('create-version',t.versions.filter(v=>v.status==='已发布').map(v=>[v.id,'v'+v.number+' · 已发布']),create.versionId))}</div><div class="form-row">${field('任务名称 *',inp('run-name',create.name))}</div>${field('输入参数（JSON）',`<textarea id="run-params">${E(create.params)}</textarea>`)}<div class="hint">${v.steps.map(s=>E(s.name)).join(' → ')}</div></div></div><div class="card"><div class="card-head"><b>02　关联主机资产</b>${L('查看主机资产','nav','assets')}</div><div class="pad">${selectedSlots.map(s=>{const hs=hosts.filter(h=>(create.bindings[s]||[]).includes(h.id));return `<div class="target" style="margin-bottom:12px"><div><b>${E(s)}　${P(hs.length+' 台')}</b><div class="sub">${hs.length?hs.map(h=>E(h.name)).join('、'):'请选择目标主机'}</div><div class="sub">引用步骤：${v.steps.filter(x=>x.target===s).map(x=>E(x.name)).join('、')}</div></div>${B('选择主机','pick-target',s,'soft')}</div>`;}).join('')||'<div class="hint">此流程只有 API / Jenkins / 通知步骤，无需主机。</div>'}</div></div><div class="card"><div class="card-head"><b>03　执行配置</b></div><div class="pad form-row">${field('Worker 池',options('run-pool',['通用执行池','隔离发布池'],create.pool))}${field('任务总超时（秒）',inp('run-timeout',create.timeout,'number'))}</div></div></div><aside><div class="card"><div class="card-head"><b>执行预览</b></div><div class="pad">${summary([['流程',E(t.name)],['版本','v'+v.number],['步骤数',v.steps.length],['目标参数',selectedSlots.length],['去重主机数',new Set(Object.values(create.bindings).flat()).size]])}<div class="hint">提交时固定流程和主机快照。后续资产变化不会改变此运行。</div>${B('预览并执行 →','preview-run','','primary')}</div></div></aside></div>`;}

function pickerModal(){const rows=pickerHosts();modal(`选择主机 · ${E(ui.pickerSlot)}`,`<div class="filters" style="padding:0 0 18px">${field('主机名称 / IP',inp('picker-query',ui.pickerQuery))}${B('查询','picker-search','','primary')}</div><div class="picker"><div class="tree"><b>服务分组</b>${['全部','Web 服务','数据库','办公服务','API 服务'].map(g=>B(g,'picker-group',g,ui.pickerGroup===g?'active':'')).join('')}</div><div>${T(['选择','主机名称 / IP','系统','环境','凭据'],rows.map(h=>[`<input type="checkbox" aria-label="选择 ${h.name}" data-check="picker" data-id="${h.id}" ${ui.picker.has(h.id)?'checked':''}>`,`<b>${h.name}</b><small>${h.ip}</small>`,h.os,P(h.env,h.env==='生产'?'orange':'blue'),h.ready?E(h.credential):P('未配置','red')]))}<div class="sub" style="margin-top:10px">筛选切换保留选择。</div></div><div><b>已选 ${ui.picker.size} 台</b>${hosts.filter(h=>ui.picker.has(h.id)).map(h=>`<div class="chosen">${L('×','picker-remove',h.id)}${h.name}<small>${h.ip}</small></div>`).join('')||'<div class="empty">尚未选择主机</div>'}${B('清空','picker-clear')}</div></div>`,B('取消','picker-cancel')+B(`确认 ${ui.picker.size} 台主机`,'picker-confirm','','primary'),true);}
function previewRun(){captureCreate();const v=activeVersion();if(!create.name.trim())return toast('请填写任务名称');try{const p=JSON.parse(create.params);if(!p||typeof p!=='object'||Array.isArray(p))throw Error();}catch{return modal('参数校验失败','<div class="hint error">输入参数必须为有效 JSON 对象，例如 {"release":"2026.09.11"}。</div>');}if(!Number.isFinite(create.timeout)||create.timeout<1)return toast('总超时必须大于零');const missing=slots(v.steps).filter(s=>!create.bindings[s]?.length);if(missing.length)return modal('目标配置不完整',`<div class="hint error">请为 ${missing.map(E).join('、')} 选择主机。</div>`);const hs=hosts.filter(h=>Object.values(create.bindings).flat().includes(h.id));const invalid=hs.filter(h=>!h.ready);const mismatch=v.steps.filter(s=>res(s.resource)?.os!=='无需主机').some(s=>hosts.filter(h=>(create.bindings[s.target]||[]).includes(h.id)).some(h=>h.os!==res(s.resource).os));if(invalid.length||mismatch)return modal('执行目标校验失败',`<div class="hint error">${invalid.length?'存在未配置凭据的主机：'+invalid.map(h=>h.name).join('、'):'步骤资源要求的操作系统与所选主机不一致，请重新选择。'}</div>`);modal('确认执行',`<h3>${E(create.name)}</h3><div class="hint">演示模式：确认后生成本地“运行中”记录，支持在详情页模拟完成、取消或失败。</div>${summary([['流程版本',E(tm(create.templateId).name)+' v'+v.number],['Worker 池',E(create.pool)],['任务总超时',create.timeout+' 秒'],['步骤数量',v.steps.length]])}<h4>目标快照 · ${hs.length} 台</h4>${T(['主机','地址','环境'],hs.map(h=>[h.name,h.ip,P(h.env)]))}<label class="checkline"><input id="run-confirm" type="checkbox">我已核对流程版本、参数及目标范围</label>`,B('返回修改','modal-back')+B('确认模拟执行','submit-run','','primary'));}
function submitRun(trigger='手动'){const v=activeVersion();const run={id:String(24019+runs.length),name:create.name,template:tm(create.templateId).name,templateId:create.templateId,versionId:v.id,version:v.number,status:'运行中',trigger,time:new Date().toLocaleString('sv-SE'),duration:'0 s',targets:clone(hosts.filter(h=>Object.values(create.bindings).flat().includes(h.id))),bindings:clone(create.bindings),steps:clone(v.steps),pool:create.pool,params:create.params,timeout:create.timeout};runs=[run,...runs];record('创建运行','#'+run.id);ui.runId=run.id;ui.detailTab='步骤执行';nav('detail');}
